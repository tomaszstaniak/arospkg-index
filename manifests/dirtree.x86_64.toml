# APPROVED 2026-09-20 for v0.1.
#
# Prints a directory tree. Ran against a real directory in the trial.
#
# Installed, started and removed on AROS One 1.3 x86_64 in QEMU; see
# docs/reports/2026-09-19-v01/. A hash and a clean unpack do not qualify a
# package -- it has to have run.

status          = "approved"
id              = "dirtree"
version         = "40.8"
summary         = "Shell command displaying directory trees"
arch            = "x86_64"
abi             = "v11"
category        = "utility/misc"
url             = "https://archives.arosworld.org/share/utility/misc/dirtree.x86_64-aros-v11.zip"
size            = 50125

sha256          = "0776eb0ad5dd0e05757da2860aca3131d5fd06ca22b27c0b0506e7e2d3b4be3b"

depends         = []
depends_checked = true     # no package in the index is needed to install this

kind            = "app"
subdir          = "DirTree"
icon            = "DirTree.info"

installs_on     = ["aros-one"]
runs_on         = ["aros-one"]
does_not_run_on = ["mainline-x86_64"]   # ABIv11 binary; the ABI gate refuses it there

# What the MACHINE must already provide: libraries AROS One ships and mainline
# does not, read out of the binaries and checked against both systems' Libs/.
[[requires_system]]
type = "library"
id   = "stdlib.library"
