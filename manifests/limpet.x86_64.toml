# Limpet 0.7.0. Our own program, published by its author as a GitHub
# release asset (tag v0.7.0): faster drawing for full-screen programs,
# links to local files, a bundled Nerd Font with the eza icons as the
# default font, several programs reading one window, line feed mode, the
# console geometry packet.
#
# Same archive layout as 0.6.1 (checked on the release asset 2026-10-24):
# Limpet/ with the program, README.txt, fonts, themes and licences, plus
# Limpet.info beside it. The experimental LIMPET: console handler is a
# separate release asset and not part of this package.
# The terminal was tested on AROS One 1.3 x86_64 under QEMU with this
# program (limpet doc/verification-0.7.0.md).
# apkg upgrade from 0.6.1.
# 0.6.1 entry: approved 2026-10-19; 0.6.0: 2026-10-18; 0.5.0: 2026-10-15;
# 0.4.1: 2026-10-13; 0.4.0: 2026-10-13; 0.3.0: 2026-10-11; 0.2.1: 2026-10-11;
# 0.2.0: 2026-10-08; 0.1.0: 2026-10-04.

status          = "approved"
id              = "limpet"
version         = "0.7.0"
revision        = 1
summary         = "Terminal for the AROS Shell: Unicode, colour, scrollback, reflow"
arch            = "x86_64"
abi             = "v11"
category        = "utility/shell"
url             = "https://github.com/tomaszstaniak/limpet/releases/download/v0.7.0/Limpet-0.7.0-abiv11.zip"
size            = 5305485
sha256          = "5ef9188e8cdd39f4fb8f9c27f55424cb672d706e6e4555f831061b74770b91c6"
kind            = "app"

depends         = []
depends_checked = true
subdir          = "Limpet"
icon            = "Limpet.info"   # the drawer icon, beside Limpet/ at the archive root
installs_on     = ["aros-one"]
runs_on         = ["aros-one"]        # 0.7.0 started after apkg upgrade 2026-10-24
does_not_run_on = ["mainline-x86_64"] # ABIv11 binary; mainline is ABIv1

# Libraries the binary opens that AROS One supplies. The system font
# FONTS:TrueType/VeraMono.ttf is used when the bundled font is removed or
# another font is set; OpenSans-Regular.ttf is also required.
[[requires_system]]
type = "library"
id   = "freetype2.library"

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[source]
repository = "https://github.com/tomaszstaniak/limpet"
revision   = "v0.7.0"
built_with = "abiv11-x86_64, GCC 10.5.0"
