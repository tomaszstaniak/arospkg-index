# Boxer for AROS 0.2.0 preview 1, mainline x86_64 build. Our own port, published
# by its author as a GitHub release asset (prerelease, tag v0.2.0-preview1). An
# experimental preview: a game session can freeze, and closing a hung session
# can crash AROS. Under QEMU, games and their sound slowed down seriously when
# the host ran QEMU at low priority; at normal priority the tested game ran at
# full speed. Physical hardware has not been tested.
#
# The .zip, not the release's .pkg: apkg reads ZIP and LHA only (the .pkg is for
# C:Unpack on systems without UnZip). Same layout as the ABIv11 archive. BoxerUI
# links GNU libiconv (LGPL); its source and a relink kit are the release asset
# Boxer-0.2.0-preview1-aros-x86_64-abiv1-pc-lgpl-kit.zip.
# Game icons start Boxer:BoxerUI, so the user runs Install-Assign once after
# installing; apkg makes no assigns. Install-Assign REMOVE undoes it.
# Built against mainline AROS 87266168 (2026-10-26); older systems were not tried.
# installs_on stays empty until these bytes have been installed with apkg.

status          = "approved"
id              = "boxer"
version         = "0.2.0-preview1"
revision        = 1
summary         = "DOS game front end with Boxer's DOSBox core: import, gameboxes, covers (experimental preview)"
category        = "emulation/computer"
license         = "GPL-2.0"
url             = "https://github.com/tomaszstaniak/aros-boxerapp/releases/download/v0.2.0-preview1/Boxer-0.2.0-preview1-aros-x86_64-abiv1-pc.zip"
size            = 14504914
sha256          = "ae4747f03b972b00986a181b69d11c758921f86a8e54fb66d8f96b480d037805"
kind            = "app"
arch            = "x86_64"
abi             = "v1"

depends         = []
depends_checked = true
subdir          = "Boxer"
icon            = "Boxer.info"   # the drawer icon, beside Boxer/ at the archive root
installs_on     = []
runs_on         = ["mainline-x86_64"]   # this BoxerUI started from the unpacked archive under QEMU, 2026-11-03
does_not_run_on = ["aros-one"]          # ABIv1 binary; AROS One is ABIv11

post_install_notes = [
  "Experimental preview: use a test installation of AROS. A hung game session can crash AROS.",
  "On mainline AROS under QEMU, games and sound slowed down seriously when the host ran QEMU at low priority. Real hardware is untested.",
  "Before the first start, run Install-Assign in the Boxer drawer. It sets the Boxer: assign that game icons use.",
  "Before removing Boxer, run Execute Install-Assign REMOVE in its drawer.",
  "Removing Boxer keeps your games folder, its Boxer Data and ENVARC:Boxer.",
  "No games are included. ReadMe.txt in the drawer describes import and the logs.",
]

# Libraries the binary opens at start, which mainline supplies. SDL3 is linked
# statically and gl.library is not required.
[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[[requires_system]]
type = "library"
id   = "muimaster.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[[requires_system]]
type = "library"
id   = "diskfont.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-boxerapp"
revision   = "v0.2.0-preview1"
built_with = "mainline-x86_64, GCC 10.5.0"

[launch]
executable = "BoxerUI"
mode       = "workbench"
