# Maintainer's record for Boxer x86_64 ABIv11, kept here so an author
# submission replacing manifests/boxer.x86_64.v11.toml does not drop it.
#
# Tested 2026-11-04 with the 0.2.0-preview1 archive of this entry (sha256
# 31958659...): apkg 0.7.3 on AROS One 1.3 under QEMU installed it from the
# release URL and upgraded 0.1.0-preview5 to it (runtime-tests/).
# A new archive's bytes are not covered by this test; update or remove
# these fields when a new release is tested.
installs_on = ["aros-one"]
#
# post_install_notes: the manifest's lines with one added (2026-11-04):
# after `apkg upgrade` the Boxer: assign still points to the moved old
# drawer. The whole list is kept here because an override replaces it.
# Keep it in step with the manifest's lines.
post_install_notes = [
  "Experimental preview: use a test installation of AROS. A hung game session can crash AROS.",
  "Before the first start, run Install-Assign in the Boxer drawer. It sets the Boxer: assign that game icons use.",
  "After upgrading with apkg, open the newly installed Boxer folder, run Install-Assign and choose Replace if prompted.",
  "Before removing Boxer, run Execute Install-Assign REMOVE in its drawer.",
  "Removing Boxer keeps your games folder, its Boxer Data and ENVARC:Boxer.",
  "No games are included. ReadMe.txt in the drawer describes import and the logs.",
]
