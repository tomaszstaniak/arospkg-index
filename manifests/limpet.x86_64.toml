# Limpet 0.10.0: colour themes (fifteen included; Ghostty, Kitty and iTerm2 colour files work as they are),
# Preferences with pages for appearance, the Shell and the terminal.
# Experimental handler is distributed separately. Release assets downloaded and SHA-256 checked.
# Runtime scope: limpet/doc/verification-0.10.0.md.
status          = "approved"
id              = "limpet"
version         = "0.10.0"
revision        = 1
summary         = "Terminal for the AROS Shell: Unicode, colour, scrollback, reflow"
arch            = "x86_64"
abi             = "v11"
category        = "utility/shell"
url             = "https://github.com/tomaszstaniak/limpet/releases/download/v0.10.0/Limpet-0.10.0-aros-x86_64-abiv11-pc.zip"
size            = 5381549
sha256          = "6bca6406ccab56d96c8e267029b164db47253dca42adf0b31fb794cda6bd5380"
kind            = "app"

depends         = []
depends_checked = true
subdir          = "Limpet"
icon            = "Limpet.info"   # the drawer icon, beside Limpet/ at the archive root
installs_on     = ["aros-one"]
runs_on         = ["aros-one"]
does_not_run_on = ["mainline-x86_64"] # ABIv11 binary; mainline is ABIv1

# Libraries the binary opens that AROS One supplies. The system font
# FONTS:TrueType/VeraMono.ttf is used when the bundled font is removed or
# another font is set; OpenSans-Regular.ttf is also required.
[[requires_system]]
type = "library"
id   = "freetype2.library"

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[source]
repository = "https://github.com/tomaszstaniak/limpet"
revision   = "v0.10.0"
built_with = "abiv11-x86_64, GCC 10.5.0"
