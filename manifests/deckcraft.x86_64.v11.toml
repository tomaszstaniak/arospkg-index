# DeckCraft for AROS 0.8.0-test1-r2. Our own port of storytold/deckcraft, published by its author as a
# GitHub release asset (prerelease, tag v0.8.0-test1-r2). Experimental and not optimised.
# Rebuild 2: the same program as the earlier test build, without build-machine paths.
# Archive layout (checked 2026-10-20): DeckCraft/ with DeckCraft, its icon, the CLI, README, SOURCE.txt and Licenses/, plus DeckCraft.info beside it.
# First entry for this package.

status          = "approved"
id              = "deckcraft"
version         = "0.8.0-test1-r2"
revision        = 1
summary         = "Presentation program for PPTX with slide show and PDF export (experimental, not optimised)"
category        = "office/presentation"
license         = "MIT OR Apache-2.0"
url             = "https://github.com/tomaszstaniak/aros-deckcraft/releases/download/v0.8.0-test1-r2/DeckCraft-0.8.0-test1-r2.x86_64-aros-v11.zip"
size            = 55075595
sha256          = "9704ac4345138532dac9493463fb0238eb322fdfecedaabe9d6d00a3dd7d3d3b"
kind            = "app"
arch            = "x86_64"
abi             = "v11"

depends         = []
depends_checked = true
subdir          = "DeckCraft"
icon            = "DeckCraft.info"   # the drawer icon, beside DeckCraft/ at the archive root
installs_on     = ["aros-one"]
does_not_run_on = ["mainline-x86_64"] # ABIv11 binary; mainline is ABIv1

post_install_notes = [
  "Experimental and not optimised: the interface is drawn by the CPU and reacts slowly. Use a test installation.",
  "Sound and video play silently. No printing: export to PDF instead.",
  "Settings are kept in DeckCraftData inside the program's drawer.",
  "x86_64 ABIv11 only; letters typed with a non-Latin-1 keymap come out wrong.",
]

# System libraries the programs open; AROS One supplies them. bsdsocket.library is optional.
[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[[requires_system]]
type = "library"
id   = "iffparse.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-deckcraft"
revision   = "v0.8.0-test1-r2"
built_with = "abiv11-x86_64, GCC 10.5.0, Rust nightly 1.100 (rust-aros)"

[launch]
executable = "DeckCraft"
mode       = "workbench"
