# APPROVED 2026-09-20 for v0.1.
#
# A sokoban-style puzzle, SDL. Statically linked SDL2; needs SDL.library, crt and stdlib from the distribution.
#
# Installed, started and removed on AROS One 1.3 x86_64 in QEMU; see
# docs/reports/2026-09-19-v01/. A hash and a clean unpack do not qualify a
# package -- it has to have run.

status          = "approved"
id              = "blips"
version         = "1.0"
summary         = "a sokoban style puzzle"
arch            = "x86_64"
abi             = "v11"
category        = "game/puzzle"
url             = "https://archives.arosworld.org/share/game/puzzle/blips.x86_64-aros-v11.zip"
size            = 1408356

sha256          = "bbd9576dfdedc2f3d508894f81c38ee22870804ae56cb9f0b37b91bcd1011362"

depends         = []
depends_checked = true     # no package in the index is needed to install this

kind            = "app"
subdir          = "Blips"
icon            = "Blips.info"

installs_on     = ["aros-one"]
runs_on         = ["aros-one"]
does_not_run_on = ["mainline-x86_64"]   # ABIv11 binary; the ABI gate refuses it there

# What the MACHINE must already provide: libraries AROS One ships and mainline
# does not, read out of the binaries and checked against both systems' Libs/.
[[requires_system]]
type = "library"
id   = "SDL.library"

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"
