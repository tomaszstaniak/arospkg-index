# arospkg 0.7.3. PkgManager fixes link backgrounds after hover.
# v11 and mainline GUI checked in QEMU; Pi and i386 compiled only.

status          = "approved"
id              = "arospkg"
version         = "0.7.3"
summary         = "Package manager for AROS: find, install, start, update and remove programs"
arch            = "aarch64"
abi             = "v1"
category        = "utility/system"
url             = "https://github.com/tomaszstaniak/arospkg/releases/download/v0.7.3/arospkg-0.7.3.aarch64-aros-raspi.zip"
size            = 1075168
sha256          = "bf6b3feaa0031801b758b6c17a34fa0b01d35901bcdafb570ef632f596528d97"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "arospkg-0.7.3.aarch64-aros-raspi"
installs_on     = []
does_not_run_on = []

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[[requires_system]]
type = "library"
id   = "muimaster.library"

# PkgManager starts from its icon; the archive carries the same table as
# application.json.
[launch]
executable = "PkgManager"
mode       = "workbench"

[source]
repository = "https://github.com/tomaszstaniak/arospkg"
revision   = "v0.7.3"
