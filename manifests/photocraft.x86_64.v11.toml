# PhotoCraft for AROS 0.7.0-preview4. Our own port of storytold/photocraft, published by its author as a
# GitHub release asset (prerelease, tag v0.7.0-preview4). Experimental and not optimised.
# Preview 4: keeps the startup drawer's lock on the main task (Workbench exit fix), whole-program LTO, stripped programs.
# Archive layout (checked 2026-10-23): PhotoCraft/ with PhotoCraft, its icon, the CLI, README, SOURCE.txt and Licenses/, plus PhotoCraft.info beside it.
# The program is over 64 MiB unpacked, so this entry is for apkg 0.6.0 and later only (large-members).
# Preview 3 (0.7.0-preview3) was withdrawn: it exited at startup. Previous working entry: 0.7.0-preview2-r2 (2026-10-20), whose program was over apkg 0.5.0's 64 MiB file limit.

status          = "approved"
id              = "photocraft"
version         = "0.7.0-preview4"
revision        = 1
summary         = "Image editor with layers, masks, painting and PSD/PNG files (experimental, not optimised)"
category        = "graphics/edit"
license         = "MIT OR Apache-2.0"
url             = "https://github.com/tomaszstaniak/aros-photocraft/releases/download/v0.7.0-preview4/PhotoCraft-0.7.0-preview4.x86_64-aros-v11.zip"
size            = 45313856
sha256          = "58421ad981e0309495cf68b4a4f9f1a9234978fb1c5d7e6a2e0d62a02d1a774c"
kind            = "app"
arch            = "x86_64"
abi             = "v11"

depends         = []
depends_checked = true
subdir          = "PhotoCraft"
icon            = "PhotoCraft.info"   # the drawer icon, beside PhotoCraft/ at the archive root
installs_on     = ["aros-one"]
does_not_run_on = ["mainline-x86_64"] # ABIv11 binary; mainline is ABIv1

post_install_notes = [
  "Experimental and not optimised: the interface is drawn by the CPU and reacts slowly. Use a test installation.",
  "Use file names without accented letters. Large documents can be slow.",
  "Needs apkg 0.6.0 or later.",
  "x86_64 ABIv11 only; letters typed with a non-Latin-1 keymap come out wrong.",
]

# System libraries the programs open; AROS One supplies them. bsdsocket.library is optional.
[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[[requires_system]]
type = "library"
id   = "iffparse.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-photocraft"
revision   = "v0.7.0-preview4"
built_with = "abiv11-x86_64, GCC 10.5.0, Rust nightly 1.100 (rust-aros)"

[launch]
executable = "PhotoCraft"
mode       = "workbench"
