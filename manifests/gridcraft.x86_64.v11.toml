# GridCraft for AROS 0.8.0-test4. Our own port of storytold/gridcraft, published by its author as a
# GitHub release asset (prerelease, tag v0.8.0-test4). Experimental and not optimised.
# Test 4: documents named relatively on the command line are kept with their full path (Recent works after a Workbench start); typing into a cell keeps every key and its order when keys come faster than the window redraws; the startup-directory check stops the program if the drawer cannot be locked.
# Archive layout (checked 2026-10-23): GridCraft/ with GridCraft, its icon, the CLI, README, SOURCE.txt and Licenses/, plus GridCraft.info beside it.
# Every file is under 64 MiB, so apkg 0.5.0 installs it too. Previous entry: 0.8.0-test3 (2026-10-23).

status          = "approved"
id              = "gridcraft"
version         = "0.8.0-test4"
revision        = 1
summary         = "Spreadsheet for XLSX with formulas, charts and CSV/PDF export (experimental, not optimised)"
category        = "office/spreadsheet"
license         = "MIT OR Apache-2.0"
url             = "https://github.com/tomaszstaniak/aros-gridcraft/releases/download/v0.8.0-test4/GridCraft-0.8.0-test4.x86_64-aros-v11.zip"
size            = 14724164
sha256          = "fbe42fb2cd639615c03483dd54889fe449e0c41dc3f016b7792dda5b06106dad"
kind            = "app"
arch            = "x86_64"
abi             = "v11"

depends         = []
depends_checked = true
subdir          = "GridCraft"
icon            = "GridCraft.info"   # the drawer icon, beside GridCraft/ at the archive root
installs_on     = ["aros-one"]
does_not_run_on = ["mainline-x86_64"] # ABIv11 binary; mainline is ABIv1

post_install_notes = [
  "Experimental and not optimised: the interface is drawn by the CPU and reacts slowly. Use a test installation.",
  "Save before closing the window: the close gadget does not ask about unsaved changes.",
  "Settings are kept in GridCraftData inside the program's drawer.",
  "x86_64 ABIv11 only; letters typed with a non-Latin-1 keymap come out wrong.",
]

# System libraries the programs open; AROS One supplies them. bsdsocket.library is optional.
[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[[requires_system]]
type = "library"
id   = "iffparse.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-gridcraft"
revision   = "v0.8.0-test4"
built_with = "abiv11-x86_64, GCC 10.5.0, Rust nightly 1.100 (rust-aros)"

[launch]
executable = "GridCraft"
mode       = "workbench"
