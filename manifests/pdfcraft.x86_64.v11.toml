# PdfCraft for AROS 0.9.0-test4. Our own port of storytold/pdfcraft, published by its author as a
# GitHub release asset (prerelease, tag v0.9.0-test4). Experimental and not optimised.
# Test 4 fixes a crash after closing PdfCraft when it was started from Workbench (the starting
# drawer's lock was released twice). Whole-program LTO and stripped programs keep the largest
# file at 64171400 bytes, under the client's 64 MiB per-file limit that refused test2-r2.
# Archive layout (checked 2026-10-22): PdfCraft/ with PdfCraft, its tool icon, pdfcraft-cli,
# README.txt, BUILD.json, notices and Licenses/, plus PdfCraft.info beside it.
# Replaces 0.9.0-test2-r2 (revision 1).

status          = "approved"
id              = "pdfcraft"
version         = "0.9.0-test4"
revision        = 1
summary         = "PDF viewer and editor: search, rotate, save (experimental, not optimised)"
category        = "office/misc"
license         = "MIT OR Apache-2.0"
url             = "https://github.com/tomaszstaniak/aros-pdfcraft/releases/download/v0.9.0-test4/PdfCraft-0.9.0-test4.x86_64-aros-v11.zip"
size            = 36681261
sha256          = "1d06e9e8ff5ebbadab1d1276c0b263a8f58e54608ec34acb96d8fa95e6904f10"
kind            = "app"
arch            = "x86_64"
abi             = "v11"

depends         = []
depends_checked = true
subdir          = "PdfCraft"
icon            = "PdfCraft.info"   # the drawer icon, beside PdfCraft/ at the archive root
installs_on     = ["aros-one"]
does_not_run_on = ["mainline-x86_64"] # ABIv11 binary; mainline is ABIv1

post_install_notes = [
  "Experimental and not optimised: the interface is drawn by the CPU and reacts slowly. Use a test installation.",
  "Double-click the PdfCraft icon; from a Shell run Stack 4000000 first. OCR and printing are not available.",
  "Test 4 fixes a crash after closing PdfCraft started from Workbench. README.txt in the drawer explains logging.",
  "x86_64 ABIv11 only; letters typed with a non-Latin-1 keymap come out wrong.",
]

# System libraries the programs open; AROS One supplies them. bsdsocket.library is optional.
[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[[requires_system]]
type = "library"
id   = "iffparse.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-pdfcraft"
revision   = "v0.9.0-test4"
built_with = "abiv11-x86_64, GCC 10.5.0, Rust nightly 1.100 (rust-aros)"

[launch]
executable = "PdfCraft"
mode       = "workbench"
