# APPROVED 2026-09-20 for v0.1.
#
# Klondike and Freecell, MUI/Zune. Requires MUI, which Zune provides; its install script copies nothing into system directories.
#
# Installed, started and removed on AROS One 1.3 x86_64 in QEMU; see
# docs/reports/2026-09-19-v01/. A hash and a clean unpack do not qualify a
# package -- it has to have run.

status          = "approved"
id              = "soliton"
version         = "2.2"
summary         = "Klondike & Freecell card game"
arch            = "x86_64"
abi             = "v11"
category        = "game/card"
url             = "https://archives.arosworld.org/share/game/card/soliton.x86_64-aros-v11.zip"
size            = 223945

sha256          = "62c9b8a9713d80ffc303f1b1ca83625ae54faf452a45442d048a45ef87a9115e"

depends         = []
depends_checked = true     # no package in the index is needed to install this

kind            = "app"
subdir          = "Soliton"
icon            = "Soliton.info"

installs_on     = ["aros-one"]
runs_on         = ["aros-one"]
does_not_run_on = ["mainline-x86_64"]   # ABIv11 binary; the ABI gate refuses it there

# What the MACHINE must already provide: libraries AROS One ships and mainline
# does not, read out of the binaries and checked against both systems' Libs/.
[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"
