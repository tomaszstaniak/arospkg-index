# Limpet 0.12.1: adds scp, ssh-keygen and ssh-copy-id beside ssh (libssh with the aros-crypto kit).
# The terminal, its settings and the experimental handler (distributed separately) are unchanged.
# Release assets downloaded and SHA-256 checked. Runtime scope: limpet/doc/verification-0.12.1.md.
status          = "approved"
id              = "limpet"
version         = "0.12.1"
revision        = 1
summary         = "Terminal for the AROS Shell: Unicode, colour, scrollback, reflow"
arch            = "x86_64"
abi             = "v1"
category        = "utility/shell"
url             = "https://github.com/tomaszstaniak/limpet/releases/download/v0.12.1/Limpet-0.12.1-aros-x86_64-abiv1-pc.zip"
size            = 7320466
sha256          = "cbfc324d62f6f62bdb55794223499d83f4b0b7f4edcd805f23bb5be350c0f953"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "Limpet"
icon            = "Limpet.info"   # the drawer icon, beside Limpet/ at the archive root
installs_on     = ["mainline-x86_64"]   # apkg 0.7.8 install of 0.11.0, 2026-11-14 (runtime-tests/)
runs_on         = ["mainline-x86_64"]   # 0.12.1 run from the unpacked archive 2026-11-15
does_not_run_on = ["aros-one"]          # ABIv1 binary; AROS One is ABIv11

# Libraries the binary opens that mainline supplies. The system fonts
# FONTS:TrueType/OpenSans-Regular.ttf and VeraMono.ttf are also used.
[[requires_system]]
type = "library"
id   = "freetype2.library"

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[source]
repository = "https://github.com/tomaszstaniak/limpet"
revision   = "v0.12.1"
built_with = "mainline-x86_64, GCC 10.5.0"
