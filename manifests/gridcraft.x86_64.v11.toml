# GridCraft for AROS 0.8.0-test1-r2. Our own port of storytold/gridcraft, published by its author as a
# GitHub release asset (prerelease, tag v0.8.0-test1-r2). Experimental and not optimised.
# Rebuild 2: the same program as the earlier test build, without build-machine paths.
# Archive layout (checked 2026-10-20): GridCraft/ with GridCraft, its icon, the CLI, README, SOURCE.txt and Licenses/, plus GridCraft.info beside it.
# First entry for this package.

status          = "approved"
id              = "gridcraft"
version         = "0.8.0-test1-r2"
revision        = 1
summary         = "Spreadsheet for XLSX with formulas, charts and CSV/PDF export (experimental, not optimised)"
category        = "office/spreadsheet"
license         = "MIT OR Apache-2.0"
url             = "https://github.com/tomaszstaniak/aros-gridcraft/releases/download/v0.8.0-test1-r2/GridCraft-0.8.0-test1-r2.x86_64-aros-v11.zip"
size            = 19175748
sha256          = "6fde48f812190c15fb73e3d0b1327aa6efd47f5d5191caad840da74182a0df23"
kind            = "app"
arch            = "x86_64"
abi             = "v11"

depends         = []
depends_checked = true
subdir          = "GridCraft"
icon            = "GridCraft.info"   # the drawer icon, beside GridCraft/ at the archive root
installs_on     = ["aros-one"]
does_not_run_on = ["mainline-x86_64"] # ABIv11 binary; mainline is ABIv1

post_install_notes = [
  "Experimental and not optimised: the interface is drawn by the CPU and reacts slowly. Use a test installation.",
  "Save before closing the window: the close gadget does not ask about unsaved changes.",
  "Settings are kept in GridCraftData inside the program's drawer.",
  "x86_64 ABIv11 only; letters typed with a non-Latin-1 keymap come out wrong.",
]

# System libraries the programs open; AROS One supplies them. bsdsocket.library is optional.
[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[[requires_system]]
type = "library"
id   = "iffparse.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-gridcraft"
revision   = "v0.8.0-test1-r2"
built_with = "abiv11-x86_64, GCC 10.5.0, Rust nightly 1.100 (rust-aros)"

[launch]
executable = "GridCraft"
mode       = "workbench"
