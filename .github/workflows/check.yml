# Every pull request that changes a manifest: download each changed archive
# within the client's limits, check its size and SHA-256 against the
# manifest, and generate both catalogue files as a trial. Read-only token, no
# secrets; nothing from the pull request is run (manifests are read as TOML
# data, archives are only listed and their headers read). The automatic
# review runs here; a pull request that edits review/ or history.json fails,
# because only the publish workflow writes them.
name: check
on:
  pull_request:
    paths: ["manifests/**", "overrides/**", "runtime-tests/**", "review/**", "history.json"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # The tools come from arospkg at a fixed commit, never from the pull request.
      - uses: actions/checkout@v4
        with:
          # A test copy of this repository sets TOOLS_REPO/TOOLS_REF to test tools;
          # here they are unset and the pinned arospkg commit is used.
          repository: ${{ vars.TOOLS_REPO || 'tomaszstaniak/arospkg' }}
          ref: ${{ vars.TOOLS_REF || 'b5cfb4c8c3ae8b16caf97dd9b0262bc61d3cc511' }}
          path: .tools
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y lhasa
      - run: python3 .tools/tools/ci_check_index.py . --base "origin/${{ github.base_ref }}" --cache "$RUNNER_TEMP/archives"
