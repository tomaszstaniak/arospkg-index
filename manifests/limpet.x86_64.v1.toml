# Limpet 0.14.0: TAB completion of the options of Unix-style programs; programs and apkg packages
# bring their own definitions (Completions/<command>), as eza 0.23.5 revision 3 and Fastfetch 2.70.0 revision 6 do.
# Release assets downloaded and SHA-256 checked. Runtime scope: limpet/doc/verification-0.14.0.md.
status          = "approved"
id              = "limpet"
version         = "0.14.0"
revision        = 1
summary         = "Terminal for the AROS Shell: Unicode, colour, scrollback, reflow"
arch            = "x86_64"
abi             = "v1"
category        = "utility/shell"
url             = "https://github.com/tomaszstaniak/limpet/releases/download/v0.14.0/Limpet-0.14.0-aros-x86_64-abiv1-pc.zip"
size            = 7338716
sha256          = "1b0398dd77c7c87a83a6ca873a86fe1574206e62f71d0db5df44cce31026c24c"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
post_install_notes = [
  "Needs an AROS nightly of 2026-11-24 or later; for earlier nightlies use Limpet 0.13.0 from the project page.",
]
subdir          = "Limpet"
icon            = "Limpet.info"   # the drawer icon, beside Limpet/ at the archive root
installs_on     = ["mainline-x86_64"]   # apkg install and verify of 0.13.1 on nightly 2026-11-24, 2026-11-25 (runtime-tests/)
runs_on         = ["mainline-x86_64"]   # 0.14.0 run from the unpacked archive on nightly 2026-11-24, 2026-11-28
does_not_run_on = ["aros-one"]          # ABIv1 binary; AROS One is ABIv11

# Libraries the binary opens that mainline supplies. The system fonts
# FONTS:TrueType/OpenSans-Regular.ttf and VeraMono.ttf are also used.
[[requires_system]]
type = "library"
id   = "freetype2.library"

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

# Revision 2 adds only this table: the same archive, now with Run in apkg
# and PkgManager.
[launch]
executable = "Limpet"
mode       = "workbench"

[source]
repository = "https://github.com/tomaszstaniak/limpet"
revision   = "v0.14.0"
built_with = "mainline-x86_64, GCC 10.5.0"
