# APPROVED 2026-09-20 for v0.1.
#
# An asteroid avoidance game. Readme: written in C++, requires no installation.
#
# Installed, started and removed on AROS One 1.3 x86_64 in QEMU; see
# docs/reports/2026-09-19-v01/. A hash and a clean unpack do not qualify a
# package -- it has to have run.

status          = "approved"
id              = "shooterspace"
version         = "1.0"
summary         = "Avoid asteroids and deal with threatening UFOs"
arch            = "x86_64"
abi             = "v11"
category        = "game/misc"
url             = "https://archives.arosworld.org/share/game/misc/shooterspace.x86_64-aros-v11.zip"
size            = 1184697

sha256          = "173a4f28870be7cc37c1865d0e9f58d6bec3a84df08123a5cc52461e6f9f0254"

depends         = []
depends_checked = true     # no package in the index is needed to install this

kind            = "app"
subdir          = "ShooterSpace1.0"
icon            = "ShooterSpace1.0.info"

installs_on     = ["aros-one"]
runs_on         = ["aros-one"]
does_not_run_on = ["mainline-x86_64"]   # ABIv11 binary; the ABI gate refuses it there

# What the MACHINE must already provide: libraries AROS One ships and mainline
# does not, read out of the binaries and checked against both systems' Libs/.
[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"
