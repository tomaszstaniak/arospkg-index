[source]
repository = "https://github.com/tomaszstaniak/aros-cadcraft"
revision = "v0.20.1"
archive = "CADCraft-0.20.1-source.zip"
built_with = "Raspberry Pi AArch64 ABIv1 (nightly 2026-11-10 SDK), Clang 20.1.0, Rust nightly 1.100 (rust-aros), egui 0.37 through egui-aros"

[launch]
executable = "CADCraft"
mode = "workbench"
