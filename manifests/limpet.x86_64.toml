# Limpet 0.15.0: LimpetLearn writes a TAB completion definition from a program's --help or an AmigaDOS
# command's template; definitions can hold the options of single subcommands.
# Release assets downloaded and SHA-256 checked. Runtime scope: limpet/doc/verification-0.15.0.md.
status          = "approved"
id              = "limpet"
version         = "0.15.0"
revision        = 1
summary         = "Terminal for the AROS Shell: Unicode, colour, scrollback, reflow"
arch            = "x86_64"
abi             = "v11"
category        = "utility/shell"
url             = "https://github.com/tomaszstaniak/limpet/releases/download/v0.15.0/Limpet-0.15.0-aros-x86_64-abiv11-pc.zip"
size            = 7570465
sha256          = "65bf8439e440b2191c30162bbe0f39fb7a9a3520f2b06affa15b5fe4fbd9e1e8"
kind            = "app"

depends         = []
depends_checked = true
subdir          = "Limpet"
icon            = "Limpet.info"   # the drawer icon, beside Limpet/ at the archive root
installs_on     = ["aros-one"]
runs_on         = ["aros-one"]   # 0.15.0 source run before packaging, 2026-11-28
does_not_run_on = ["mainline-x86_64"] # ABIv11 binary; mainline is ABIv1

# Libraries the binary opens that AROS One supplies. The system font
# FONTS:TrueType/VeraMono.ttf is used when the bundled font is removed or
# another font is set; OpenSans-Regular.ttf is also required.
[[requires_system]]
type = "library"
id   = "freetype2.library"

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

# Revision 2 adds only this table: the same archive, now with Run in apkg
# and PkgManager.
[launch]
executable = "Limpet"
mode       = "workbench"

[source]
repository = "https://github.com/tomaszstaniak/limpet"
revision   = "v0.15.0"
built_with = "abiv11-x86_64, GCC 10.5.0"
