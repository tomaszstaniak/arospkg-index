# APPROVED 2026-09-27. Folio 0.4, source commit f6294e1.
# Release LHA installed from a seeded cache and from the public GitHub URL
# with apkg on AROS One 1.3 x86_64 ABIv11, QEMU pool v11-1. Both installs
# verified the archive checksum. The installed program opened the arXiv PDF;
# centred cover/last page, Zoom Out, paired view, resize and reopen passed.
# Removal passed. Evidence: reports/folio-0.4-20260927/.
#
# Requires an 8 MiB stack (set in the icon); Shell: Stack 8388608.
# Same ABIv11 system requirements as 0.3.8. openurl.library is optional.

status          = "approved"
id              = "folio"
version         = "0.4"
summary         = "PDF reader with thumbnails, search and highlighting, on MuPDF"
arch            = "x86_64"
abi             = "v11"
category        = "office/misc"
url             = "https://github.com/tomaszstaniak/aros-foliopdf/releases/download/v0.4/Folio-0.4.x86_64-aros-v11.lha"
size            = 29365392
sha256          = "432298b9bc4abfe92cb573c6cc157d12b54ceef43888405796a7a6e68de186a2"
kind            = "app"

depends         = []
depends_checked = true
subdir          = "Folio"
icon            = "Folio.info"        # the drawer icon, beside Folio/ at the archive root
installs_on     = ["aros-one"]        # AROS One 1.3, QEMU pool v11-1, 2026-09-27
runs_on         = ["aros-one"]        # Magazine reading checks, then removed
does_not_run_on = ["mainline-x86_64"] # ABIv11 binary; mainline is ABIv1

# The binary names crt.library, m.library and stdlib.library, the ABIv11
# runtime. muimaster, asl, iffparse and cybergraphics are in every AROS.
# openurl.library is optional: it is opened only when a link in a PDF is
# clicked, and without it Folio says so in the status line.
[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-foliopdf"
revision   = "v0.4"
archive    = "Folio-0.4-source.zip"
sha256     = "9863c2608e2fb6127231e041473d6a4ef8f3e38c05fc109528dce2a16619b240"
built_with = "abiv11-x86_64, GCC 10.5.0"
