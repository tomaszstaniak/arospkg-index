# APPROVED 2026-09-20 for v0.1.
#
# An SDL Flappy Bird clone. Self-contained; its readme describes no installation step.
#
# Installed, started and removed on AROS One 1.3 x86_64 in QEMU; see
# docs/reports/2026-09-19-v01/. A hash and a clean unpack do not qualify a
# package -- it has to have run.

status          = "approved"
id              = "hocoslamfy"
version         = "2026"
summary         = "SDL Flappy Bird clone."
arch            = "x86_64"
abi             = "v11"
category        = "game/misc"
url             = "https://archives.arosworld.org/share/game/misc/hocoslamfy.x86_64-aros-v11.zip"
size            = 1640158

sha256          = "438173ee2ea27d765bef1e266cbe92aaf4261d54d40513fd8ce7034fda04e734"

depends         = []
depends_checked = true     # no package in the index is needed to install this

kind            = "app"
subdir          = "Hocoslamfy"
icon            = "Hocoslamfy.info"

installs_on     = ["aros-one"]
runs_on         = ["aros-one"]
does_not_run_on = ["mainline-x86_64"]   # ABIv11 binary; the ABI gate refuses it there

# What the MACHINE must already provide: libraries AROS One ships and mainline
# does not, read out of the binaries and checked against both systems' Libs/.
[[requires_system]]
type = "library"
id   = "SDL.library"

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"
