# APPROVED 2026-11-07: version 1.1, which the author uploaded in place of 1.0
# under the same URL (the readme, the archive page and the program's
# version string agree). Only the program and the readme changed; the
# drawer is now named after the new version.
#
# Installed, started and removed on AROS One 1.3 x86_64 (ABIv11) under QEMU
# with apkg 0.7.5. Started from its drawer with Run, stack 40960 bytes: its
# screen was open and the process was running after 15 s; Esc closed it.

status          = "approved"
id              = "shooterspace"
version         = "1.1"
summary         = "Avoid asteroids and deal with threatening UFOs"
arch            = "x86_64"
abi             = "v11"
category        = "game/misc"
url             = "https://archives.arosworld.org/share/game/misc/shooterspace.x86_64-aros-v11.zip"
size            = 1180044

sha256          = "a770110edbe45c465fdf77676aabebd585f94343ffa1d0a4b8ba51f257db5647"

depends         = []
depends_checked = true     # no package in the index is needed to install this

kind            = "app"
subdir          = "ShooterSpace1.1"
icon            = "ShooterSpace1.1.info"

installs_on     = ["aros-one"]
runs_on         = ["aros-one"]
does_not_run_on = ["mainline-x86_64"]   # ABIv11 binary; the ABI gate refuses it there

# What the MACHINE must already provide: libraries AROS One ships and mainline
# does not, read out of the binaries and checked against both systems' Libs/.
[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"
