# Dockbar 0.5.1 for x86_64 ABIv11, for example AROS One, with SVG icons.
# Our own program, published by its author as an asset of the GitHub
# release v0.5.1 (tag commit 2fe1919, one source commit for all six archives).
# The package with SVG icons: it carries libs/svgicon.library, which Dockbar
# opens as PROGDIR:libs/svgicon.library. dockbar-info-only is the same
# program without that library; it shows the programs' .info icons.
# Both packages contain the Weather widget (Widgets/org.aros.weather).
# The two ids conflict: apkg 0.6 and later refuse to install one while the
# other is installed (each would start its own Dockbar on the same docks).
# User data lives in the program drawer: PROGDIR:docks.config and
# PROGDIR:WidgetState/. Neither is in the archive, so apkg keeps both on
# upgrade and removal as files it did not install.
# requires_system: the C runtime libraries the binaries open at start, and
# muimaster and cybergraphics, which Dockbar opens. openurl.library (About
# links) and bsdsocket.library (Weather data) are optional and not listed.
# installs_on stays empty until these bytes have been installed with apkg.

status          = "approved"
id              = "dockbar"
version         = "0.5.1"
revision        = 1
summary         = "Dock for AROS: launchers, drawers, groups, clocks, see-through docks, Weather widget, SVG icons"
category        = "utility/workbench"
license         = "MIT; bundled parts keep their own licences, see NOTICES"
url             = "https://github.com/tomaszstaniak/aros-dockbar/releases/download/v0.5.1/Dockbar-0.5.1-aros-x86_64-abiv11-pc.zip"
size            = 8795179
sha256          = "4de05da5ad2ae237a4645eb3d1ed526e28e8f312e442e706eaba560a0de8c31b"
kind            = "app"
arch            = "x86_64"
abi             = "v11"

depends         = []
depends_checked = true
conflicts       = ["dockbar-info-only"]
subdir          = "Dockbar"
icon            = "Dockbar.info"   # the drawer icon, beside Dockbar/ at the archive root
installs_on     = []
runs_on         = []
does_not_run_on = []

post_install_notes = [
  "Your docks (docks.config) and Weather data (WidgetState) are kept in this drawer. apkg keeps them on upgrade and removal.",
  "dockbar-info-only is the same dock without SVG icons. Only one of the two can be installed.",
  "To switch, remove this package, install the other and copy docks.config and WidgetState from the old drawer.",
  "To start Dockbar with the system, see Installation in the ReadMe. Weather needs a running TCP/IP stack.",
  "With VMware SVGA graphics the docks can be invisible. Start Dockbar with --no-compose then.",
]

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "muimaster.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-dockbar"
revision   = "v0.5.1"
built_with = "AROS ABIv11 2026.09 SDK, GCC 10.5.0"

[launch]
executable = "Dockbar"
mode       = "workbench"
