# Limpet 0.2.0. Our own program, published by its author as a GitHub
# release asset (tag v0.2.0).
#
# Checked 2026-10-08 on AROS One 1.3 x86_64 (ABIv11) under QEMU, apkg 0.4.0,
# with this branch's catalogue: the release asset matched size and SHA-256;
# with 0.1.0 installed, `upgrade` was refused (apkg 0.4.0 does not order
# upstream versions), `remove` then `install` installed 0.2.0, verify was
# clean, the installed Limpet started a Shell in its window (Version 0.2.0),
# and remove deleted the drawer and its icon.
# Report: reports/limpet-0.2.0-x86_64-20261008/.
#
# Same archive layout as 0.1.0 (checked on the local archive 2026-10-08):
# Limpet/ with the program, README.txt, fonts, themes and licences, plus
# Limpet.info beside it. The terminal itself was tested on AROS ABIv11
# 2026.09 under QEMU (aros-xterm doc/sdk/verification-0.2.0.md).
# 0.1.0 entry: approved 2026-10-04, installed, started and removed by apkg.

status          = "approved"
id              = "limpet"
version         = "0.2.0"
revision        = 1
summary         = "Terminal for the AROS Shell: Unicode, colour, scrollback, reflow"
arch            = "x86_64"
abi             = "v11"
category        = "utility/shell"
url             = "https://github.com/tomaszstaniak/limpet/releases/download/v0.2.0/Limpet-0.2.0-abiv11.zip"
size            = 3577972
sha256          = "15d13d87c9774dfa2cca95adc0ef5384bfe92e1928cc5179d7b5aab1b5f42e56"
kind            = "app"

depends         = []
depends_checked = true
subdir          = "Limpet"
icon            = "Limpet.info"   # the drawer icon, beside Limpet/ at the archive root
installs_on     = ["aros-one"]
runs_on         = ["aros-one"]        # 0.2.0 installed, started and removed 2026-10-08
does_not_run_on = ["mainline-x86_64"] # ABIv11 binary; mainline is ABIv1

# Libraries the binary opens that AROS One supplies. The system fonts
# FONTS:TrueType/VeraMono.ttf and OpenSans-Regular.ttf are also required.
[[requires_system]]
type = "library"
id   = "freetype2.library"

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[source]
repository = "https://github.com/tomaszstaniak/limpet"
revision   = "v0.2.0"
built_with = "abiv11-x86_64, GCC 10.5.0"
