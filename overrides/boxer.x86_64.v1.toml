# post_install_notes: the manifest's lines with one added (2026-11-04):
# after `apkg upgrade` the Boxer: assign still points to the moved old
# drawer. The whole list is kept here because an override replaces it.
# Keep it in step with the manifest's lines.
post_install_notes = [
