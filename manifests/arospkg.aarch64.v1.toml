# arospkg 0.7.6. An upgrade or rollback keeps the drawers the installed
# files did not fill (empty ones a program made for itself); apkg says when
# the drawer being upgraded is in use; archive members whose path would not
# fit are refused. installs_on is filled after an apkg test of these bytes
# from the published catalogue (runtime-tests/).

status          = "approved"
id              = "arospkg"
version         = "0.7.6"
summary         = "Package manager for AROS: find, install, start, update and remove programs"
arch            = "aarch64"
abi             = "v1"
category        = "utility/system"
url             = "https://github.com/tomaszstaniak/arospkg/releases/download/v0.7.6/arospkg-0.7.6.aarch64-aros-raspi.zip"
size            = 1089285
sha256          = "f1784751dd7d1d962265a4305901dbacbffbb5b1ca1abeb5dd2c8e9948bfe907"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "arospkg-0.7.6.aarch64-aros-raspi"
installs_on     = ["mainline-aarch64"]
does_not_run_on = []

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[[requires_system]]
type = "library"
id   = "muimaster.library"

# PkgManager starts from its icon; the archive carries the same table as
# application.json.
[launch]
executable = "PkgManager"
mode       = "workbench"

[source]
repository = "https://github.com/tomaszstaniak/arospkg"
revision   = "v0.7.6"
