# After a merge to main: review the packages changed since the last published
# catalogue, regenerate index-v3.json, index-v2.json and index.json from the
# manifests, and commit them with the review records (review/) and the first
# publication dates (history.json). One run at a time; a run that fails writes
# nothing, so the published files stay as they were.
#
# The last published catalogue is the branch `published`, which this workflow
# pushes in the same atomic push as main and nothing else moves. A push is
# never forced: if main has moved, it is refused, both refs stay, and the step
# runs again on the new main (tools/publish_index.py), so an older run cannot
# replace a newer catalogue and no merge is left unreviewed.
name: publish
on:
  push:
    branches: [main]
    paths: ["manifests/**", "overrides/**", "runtime-tests/**"]
  workflow_dispatch:
    inputs:
      base:
        description: "Compare package metadata with this commit; blank: the last published catalogue (branch published)"
        required: false
        type: string
      review_all:
        description: "Review every published package again (a new review suite, changed upstream files)"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: publish-index
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # No credentials stay in the checkout while archives are read: the
      # token is used only by the push at the end.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          # A test copy of this repository sets TOOLS_REPO/TOOLS_REF to test tools;
          # here they are unset and the pinned arospkg commit is used.
          repository: ${{ vars.TOOLS_REPO || 'tomaszstaniak/arospkg' }}
          ref: ${{ vars.TOOLS_REF || '0688c3fa0a4dacb03e1f74eb32a697d80d505b5a' }}
          path: .tools
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y lhasa
      - name: Review, generate and publish the catalogue
        env:
          # Blank unless given by hand: then the branch `published` is the base.
          BASE_REF: ${{ inputs.base }}
          REVIEW_ALL: ${{ inputs.review_all && '--review-all' || '' }}
          # Used only by the push; publish_index.py keeps it from the check,
          # which reads the archives.
          TOKEN: ${{ github.token }}
        run: python3 .tools/tools/publish_index.py . --remote "https://github.com/${GITHUB_REPOSITORY}.git"
             --start "$GITHUB_SHA" ${BASE_REF:+--base "$BASE_REF"} --cache "$RUNNER_TEMP/archives" $REVIEW_ALL
