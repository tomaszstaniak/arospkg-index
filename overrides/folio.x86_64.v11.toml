# Maintainer's record for Folio x86_64 ABIv11, kept here so an author
# submission (apkg-pack submit) replacing manifests/folio.x86_64.v11.toml
# does not drop it. Applies only to this file, the x86_64/v11 variant.
#
# Tested 2026-10-12 with the Folio 0.5 archive of this entry (sha256
# e8aa4792...): apkg 0.5.0 on AROS One 1.3 under QEMU showed and installed
# it from the release URL, verified 16 files, `apkg run folio <pdf>` started
# it from its icon (8 MiB stack) from a 40960-byte Shell, it rendered a
# three-page PDF and turned a page; closed from its window and removed
# through apkg.
# A new archive's bytes are not covered by this test; update or remove
# these fields when a new release is tested.
installs_on     = ["aros-one"]
runs_on         = ["aros-one"]
does_not_run_on = ["mainline-x86_64"]
