# Limpet 0.4.1. Our own program, published by its author as a GitHub
# release asset (tag v0.4.1): a program can take back a console read it has
# out, and closing the window under drops no longer relies on a
# uniprocessor exec.
#
# Same archive layout as 0.4.0 (checked on the release asset 2026-10-13).
# Limpet/ with the program, README.txt, fonts, themes and licences, plus
# Limpet.info beside it; only Limpet/Limpet and Limpet/README.txt differ.
# The terminal was tested on AROS One 1.3 x86_64 under QEMU with this
# program (limpet doc/verification-0.4.1.md).
# apkg upgrade from 0.4.0.
# 0.4.0 entry: approved 2026-10-13; 0.3.0: 2026-10-11; 0.2.1: 2026-10-11; 0.2.0: 2026-10-08;
# 0.1.0: 2026-10-04.

status          = "approved"
id              = "limpet"
version         = "0.4.1"
revision        = 1
summary         = "Terminal for the AROS Shell: Unicode, colour, scrollback, reflow"
arch            = "x86_64"
abi             = "v11"
category        = "utility/shell"
url             = "https://github.com/tomaszstaniak/limpet/releases/download/v0.4.1/Limpet-0.4.1-abiv11.zip"
size            = 3654236
sha256          = "041e0886c546a4fb61f7b63c318b70b1e83c8f740e02a741305826be2dd985a4"
kind            = "app"

depends         = []
depends_checked = true
subdir          = "Limpet"
icon            = "Limpet.info"   # the drawer icon, beside Limpet/ at the archive root
installs_on     = ["aros-one"]
runs_on         = ["aros-one"]        # 0.4.1 started after apkg upgrade 2026-10-13
does_not_run_on = ["mainline-x86_64"] # ABIv11 binary; mainline is ABIv1

# Libraries the binary opens that AROS One supplies. The system fonts
# FONTS:TrueType/VeraMono.ttf and OpenSans-Regular.ttf are also required.
[[requires_system]]
type = "library"
id   = "freetype2.library"

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[source]
repository = "https://github.com/tomaszstaniak/limpet"
revision   = "v0.4.1"
built_with = "abiv11-x86_64, GCC 10.5.0"
