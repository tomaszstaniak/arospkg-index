# Jumpstart 0.9.0 for mainline AROS x86_64 (ABIv1), PC.
# Our own program, published by its author as an asset of the GitHub release
# v0.9.0 (one source commit for all three archives).
# 0.9.0 fixes the ARexx port left behind on exit, file rows that opened another
# file, lost aliases after a failed save and an index replaced by an incomplete
# walk; it adds pins, search in the whole clipboard text and a pause for the
# history. Pins are kept with aliases in ENVARC:Jumpstart/shortcuts.
# A keyboard launcher: a commodity with a hotkey that opens a search panel.
# It carries the Currency widget (Widgets/org.aros.currency, with curl and
# OpenSSL in its provider) and colour themes (Themes/).
# User data lives outside the drawer, in ENVARC:Jumpstart. The first start
# from the icon writes the project icon SYS:WBStartup/Jumpstart.info (start
# with the system); apkg does not install or remove it, hence the note.
# requires_system: the C runtime libraries and the libraries the program
# opens at start (read from the binary's automatic library list), and
# freetype2.library, which its text layer opens. muimaster.library (settings
# window), rexxsyslib.library (ARexx port) and bsdsocket.library (rates) are
# opened on demand and not listed.

status          = "approved"
id              = "jumpstart"
version         = "0.9.0"
revision        = 1
summary         = "Keyboard launcher: programs, files, windows, calculator, currencies, packages, clipboard history"
category        = "utility/workbench"
license         = "MIT; bundled parts keep their own licences, see ReadMe"
url             = "https://github.com/tomaszstaniak/aros-launcher/releases/download/v0.9.0/Jumpstart-0.9.0-aros-x86_64-abiv1-pc.zip"
size            = 4311502
sha256          = "9e7fa4fca99606089460b8d0be8a2f8945c4c1625f3997c3b98cf1c9b2c083ab"
kind            = "app"
arch            = "x86_64"
abi             = "v1"

depends         = []
depends_checked = true
subdir          = "Jumpstart"
icon            = "Jumpstart.info"   # the drawer icon, beside Jumpstart/ at the archive root
installs_on     = ["mainline-x86_64"]
runs_on         = ["mainline-x86_64"]
does_not_run_on = []

post_install_notes = [
  "Needs a nightly from 2026-11-06 or later.",
  "Start Jumpstart once from its icon; after that Ctrl+Alt+Space opens the panel. The first start also makes it start with the system.",
  "Before removing the package, switch off Start with the system in its settings (General), or delete SYS:WBStartup/Jumpstart.info.",
  "Settings, aliases and hotkeys are kept in ENVARC:Jumpstart, outside this drawer.",
  "Currency answers need a running TCP/IP stack. Weather needs Dockbar's Weather widget.",
]

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[[requires_system]]
type = "library"
id   = "commodities.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[[requires_system]]
type = "library"
id   = "freetype2.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-launcher"
revision   = "v0.9.0"
built_with = "official mainline AROS x86_64 SDK of 2026-11-10 (ABIv1), GCC 10.5.0"

[launch]
executable = "Jumpstart"
mode       = "workbench"
