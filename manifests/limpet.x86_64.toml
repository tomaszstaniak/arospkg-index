# Limpet 0.3.0. Our own program, published by its author as a GitHub
# release asset (tag v0.3.0): window title, Ctrl-R history search, Ctrl-C
# and inline-image fixes.
#
# Same archive layout as 0.2.1 (checked on the release asset 2026-10-11).
# Limpet/ with the program, README.txt, fonts, themes and licences, plus
# Limpet.info beside it; only Limpet/Limpet and Limpet/README.txt differ.
# The terminal was tested on AROS One 1.3 x86_64 under QEMU with this
# program (aros-xterm doc/verification-0.3.0.md).
# apkg upgrade from 0.2.1.
# 0.2.1 entry: approved 2026-10-11; 0.2.0: 2026-10-08; 0.1.0: 2026-10-04.

status          = "approved"
id              = "limpet"
version         = "0.3.0"
revision        = 1
summary         = "Terminal for the AROS Shell: Unicode, colour, scrollback, reflow"
arch            = "x86_64"
abi             = "v11"
category        = "utility/shell"
url             = "https://github.com/tomaszstaniak/limpet/releases/download/v0.3.0/Limpet-0.3.0-abiv11.zip"
size            = 3648767
sha256          = "7e2514029e0e6fadc7d331ceeb817df4b7f780dfed12409f347cf244d8a31676"
kind            = "app"

depends         = []
depends_checked = true
subdir          = "Limpet"
icon            = "Limpet.info"   # the drawer icon, beside Limpet/ at the archive root
installs_on     = ["aros-one"]
runs_on         = ["aros-one"]        # 0.3.0 started after apkg upgrade 2026-10-11
does_not_run_on = ["mainline-x86_64"] # ABIv11 binary; mainline is ABIv1

# Libraries the binary opens that AROS One supplies. The system fonts
# FONTS:TrueType/VeraMono.ttf and OpenSans-Regular.ttf are also required.
[[requires_system]]
type = "library"
id   = "freetype2.library"

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[source]
repository = "https://github.com/tomaszstaniak/limpet"
revision   = "v0.3.0"
built_with = "abiv11-x86_64, GCC 10.5.0"
