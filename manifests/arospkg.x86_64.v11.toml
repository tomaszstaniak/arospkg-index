# arospkg 0.6.0. Our own program, published by its author as a GitHub
# release asset: apkg and PkgManager.
#
# 0.6.0 adds package relations, files up to 128 MiB with size and CRC checks, and ordered
# test/preview/rc versions. The release build was run on AROS One 1.3 x86_64 (ABIv11) under
# QEMU on 2026-10-23 (update, install of five packages, verify, outdated).
# 0.5.0 entry: approved 2026-10-12; 0.4.2: 2026-10-11; 0.4.1: 2026-10-08; 0.4.0: 2026-10-04.

status          = "approved"
id              = "arospkg"
version         = "0.6.0"
summary         = "Package manager for AROS: find, install, start, update and remove programs"
arch            = "x86_64"
abi             = "v11"
category        = "utility/system"
url             = "https://github.com/tomaszstaniak/arospkg/releases/download/v0.6.0/arospkg-0.6.0.x86_64-aros-v11.zip"
size            = 921724
sha256          = "57938cdbf855d1fb7012581a07eca7c9f49b39fbbcfa7a5dad489c404b4b74b5"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "arospkg-0.6.0.x86_64-aros-v11"
installs_on     = ["aros-one"]
does_not_run_on = ["mainline-x86_64"]

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "muimaster.library"

# PkgManager starts from its icon (RFC 0002); the archive carries the same
# table as application.json.
[launch]
executable = "PkgManager"
mode       = "workbench"

[source]
repository = "https://github.com/tomaszstaniak/arospkg"
revision   = "v0.6.0"
