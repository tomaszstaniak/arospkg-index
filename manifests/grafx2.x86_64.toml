# GrafX2 2.9, this port's revision 5. Our own port, published by its author
# as a GitHub release (tag v2.9-r5). The archive carries its own
# .arospkg/manifest.toml; this entry agrees with it (id, version, revision,
# subdir, icon, requirements).
#
# Revision 5 fixes text input on non-US keymaps (patch 0012): revision 4
# applied the keymap twice, so on the Italian keymap ^ * @ and accented
# letters could not be typed. Same archive layout and requirements as
# revision 4.
#
# Needs an 8 MiB stack. The program icon inside the drawer carries it, so a
# start from Wanderer works; from a Shell, `stack 8388608` first (GrafX2/ReadMe.txt says
# so). Started from a 40960-byte Shell, GrafX2 crashes: on 2026-09-26 GrafX2
# hung the whole test machine that way.
#
# Revision 4: approved 2026-09-26 after install, start and remove by apkg 0.2
# (a513aea7) on AROS One 1.3 x86_64 (ABIv11) under QEMU.
# Evidence: docs/reports/2026-09-26-catalogue/ in arospkg.

status          = "approved"
id              = "grafx2"
version         = "2.9"
revision        = 5                   # this port's fifth release of GrafX2 2.9
summary         = "256-colour indexed paint program for AROS"
arch            = "x86_64"
abi             = "v11"
category        = "graphics/edit"
url             = "https://github.com/tomaszstaniak/aros-grafx2/releases/download/v2.9-r5/GrafX2-2.9-r5.x86_64-aros-v11.lha"
size            = 4213786
sha256          = "2587bc80ca648963c2fbe4826cbd9f7c9119cb3845adf4cc8491cb8f365c3d00"
kind            = "app"

depends         = []
depends_checked = true
subdir          = "GrafX2"
icon            = "GrafX2.info"       # the drawer icon, beside GrafX2/ at the archive root
installs_on     = ["aros-one"]        # revision 4: apkg 0.2 (a513aea7), AROS One 1.3, 2026-09-26
runs_on         = ["aros-one"]        # revision 4 started and removed 2026-09-26; revision 5 see the report
does_not_run_on = ["mainline-x86_64"] # ABIv11 binary; mainline is ABIv1

# The binary names crt.library, m.library and stdlib.library, the ABIv11
# runtime. Everything else it names is in every AROS; gl.library is linked
# and present on both checked systems; muimaster and ahi.device appear as
# strings and are not opened by the editor.
[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-grafx2"
revision   = "v2.9-r5"
archive    = "GrafX2-2.9-r5-full-source.zip"
sha256     = "57c85bd28d01327f17dbb8eeab9e38002d9149e1eb881c4caef911c6f6eb885c"
built_with = "abiv11-x86_64, GCC 10.5.0"
