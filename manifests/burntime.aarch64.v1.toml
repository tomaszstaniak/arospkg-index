# Burntime Remastered 1.3 for AROS, port release 1, native AROS on the Raspberry Pi (aarch64, ABIv1).
# A port of Jakob Harder's Burntime Remastered 1.3, rewritten in Rust; published by its author
# as a GitHub release asset (tag v1.3-aros1). The program is the one in the release's
# Burntime-1.3-aros1-aros-aarch64-abiv1-raspi.zip; this APKG adds only its manifest.
# Tried in QEMU (raspi3b) with the raspi-aarch64 nightly 20261029, not on a physical Raspberry Pi.
# No game data: the user makes burntime.pack from their own copy of the game (ReadMe in the drawer).

status          = "approved"
id              = "burntime"
version         = "1.3"
revision        = 1
summary         = "Burntime Remastered 1.3, Max Design's survival strategy game (Raspberry Pi; needs your own game data)"
category        = "game/strategy"
license         = "MIT; libraries: Zlib, BSD-3-Clause, LGPL-2.1-or-later"
url             = "https://github.com/tomaszstaniak/aros-burntime/releases/download/v1.3-aros1/Burntime-1.3-aros1-aros-aarch64-abiv1-raspi.apkg.zip"
size            = 3735098
sha256          = "69fa9420bcc12c5c6abd20fba47f357be78801eaa568a57f7973279f82e6a4af"
kind            = "app"
arch            = "aarch64"
abi             = "v1"

depends         = []
depends_checked = true
subdir          = "Burntime"
icon            = "Burntime.info"
installs_on     = []
runs_on         = []
does_not_run_on = []

post_install_notes = [
  "AROS for Raspberry Pi (aarch64). Tried in QEMU's Raspberry Pi emulation, not on a physical Raspberry Pi.",
  "Burntime needs burntime.pack made from your own copy of the game: see ReadMe in the drawer.",
  "Put it in a data drawer of its own, e.g. Work:Burntime-Data, then:",
  "MakeDir ENV:Burntime ENVARC:Burntime",
  "SetEnv SAVE Burntime/Data Work:Burntime-Data",
  "Start it from a Shell after Stack 2000000.",
  "If AROS asks for a volume Burntime at start (AROS FAT issue 2076), copy the drawer from the plain .zip. The ReadMe's no-Pi-package note predates this package.",
  "Problems: https://github.com/tomaszstaniak/aros-burntime/issues",
]

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[[requires_system]]
type = "library"
id   = "posixc.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-burntime"
revision   = "v1.3-aros1"
