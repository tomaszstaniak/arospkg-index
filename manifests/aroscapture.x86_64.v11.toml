status          = "approved"
id              = "aroscapture"
version         = "0.1.1"
revision        = 1
summary         = "Screenshot tool: area capture, markup editor, PNG, clipboard, drag to drawers, Shell commands"
category        = "graphics/edit"
license         = "MIT; bundled parts keep their own licences, see NOTICES"
url             = "https://github.com/tomaszstaniak/aros-capture/releases/download/v0.1.1/AROSCapture-0.1.1-aros-x86_64-abiv11-pc.zip"
size            = 709071
sha256          = "7d18b2900bd6624fca057486567f952e94058e4796a04a7d49566f80ca65c02c"
kind            = "app"
arch            = "x86_64"
abi             = "v11"

depends         = []
depends_checked = true
subdir          = "AROSCapture"
icon            = "AROSCapture.info"   # the drawer icon, beside AROSCapture/ at the archive root
installs_on     = []
runs_on         = ["aros-one"]
does_not_run_on = []

post_install_notes = [
  "Captures are saved to SYS:Pictures/Captures unless you choose another folder in Settings.",
  "For a Dockbar button: start Dockbar 0.6.0 or newer, then double-click Add to Dockbar in this drawer.",
]

[[recommends]]
id          = "dockbar"
min_version = "0.6.0"
reason      = "Add to Dockbar puts an AROS Capture button on a dock: capture an area, the screen, the screen in 5 seconds, open the folder"

[[requires_system]]
type = "library"
