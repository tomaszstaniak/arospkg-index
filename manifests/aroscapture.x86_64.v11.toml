[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "muimaster.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[[requires_system]]
type = "library"
id   = "datatypes.library"

[[requires_system]]
type = "library"
id   = "iffparse.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-capture"
revision   = "v0.1.1"
built_with = "AROS ABIv11 2026.09 SDK, GCC 10.5.0"

[launch]
executable = "AROSCapture"
mode       = "workbench"
