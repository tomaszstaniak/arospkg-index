# arospkg 0.4.2. Our own program, published by its author as a GitHub
# release asset: apkg and PkgManager.
#
# 0.4.2 adds apkg outdated, upgrade --all and PkgManager's Updates list.
# The release archive was tested on AROS One 1.3 x86_64 (ABIv11) under QEMU
# on 2026-10-11 (arospkg docs/evidence/2026-10-11-updates). Installed
# through this entry and started: reports/arospkg-0.4.2-20261011.
# 0.4.1 entry: approved 2026-10-08; 0.4.0: 2026-10-04.

status          = "approved"
id              = "arospkg"
version         = "0.4.2"
summary         = "Package manager for AROS: find, install, open and remove programs"
arch            = "x86_64"
abi             = "v11"
category        = "utility/system"
url             = "https://github.com/tomaszstaniak/arospkg/releases/download/v0.4.2/arospkg-0.4.2.x86_64-aros-v11.zip"
size            = 741579
sha256          = "5536075b79e568776ff33979b17f0cbdc29a838ff341d400dd56aba420d0aa12"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "arospkg-0.4.2.x86_64-aros-v11"
installs_on     = ["aros-one"]
does_not_run_on = ["mainline-x86_64"]

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "muimaster.library"

[source]
repository = "https://github.com/tomaszstaniak/arospkg"
