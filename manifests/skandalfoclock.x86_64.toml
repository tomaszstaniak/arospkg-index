# APPROVED 2026-09-20 for v0.1.
#
# An analogue clock. Its guide's WBStartup steps are optional; it runs from its drawer.
#
# Installed, started and removed on AROS One 1.3 x86_64 in QEMU; see
# docs/reports/2026-09-19-v01/. A hash and a clean unpack do not qualify a
# package -- it has to have run.

status          = "approved"
id              = "skandalfoclock"
version         = "1.1"
summary         = "Advanced Analog Clock"
arch            = "x86_64"
abi             = "v11"
category        = "utility/workbench"
url             = "https://archives.arosworld.org/share/utility/workbench/skandalfoclock.x86_64-aros-v11.zip"
size            = 177395

sha256          = "d687ccb1d86163e866d1338b404c836dfc6544a01e1f7d3e33bb17ca2f35559b"

depends         = []
depends_checked = true     # no package in the index is needed to install this

kind            = "app"
subdir          = "SkandalfoClock"
icon            = ""

installs_on     = ["aros-one"]
runs_on         = ["aros-one"]
does_not_run_on = ["mainline-x86_64"]   # ABIv11 binary; the ABI gate refuses it there

# What the MACHINE must already provide: libraries AROS One ships and mainline
# does not, read out of the binaries and checked against both systems' Libs/.
[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"
