# arospkg 0.8.4 (the programs of 0.8.3 under the new version number; the
# mainline and Raspberry Pi builds were remade for nightlies from 2026-11-24).
# 0.8.3: PkgManager: "Installed only" beside the list's name narrows
# the chosen view or category to what is installed.
# 0.8.2: PkgManager no longer fails on the Raspberry Pi when its list has
# icons; the buttons of a package's page stay inside the window.
# 0.8.1: the row's button stays inside a list that got narrower.
# 0.8.0: a new PkgManager window: views and categories in a list on
# the left, a button in every row (Install, Run or Upgrade), a page for each
# package, a menu. Pictures of packages (icons, screenshots) from the media
# drawer of the package root. The demonstration of 0.5.0 to 0.7.8 is removed.
# installs_on: these bytes updated the catalogue, installed micropolis and
# limpet and verified limpet on AROS One (QEMU, 2026-11-24); PkgManager listed
# the installed game with Installed only (runtime-tests/).

status          = "approved"
id              = "arospkg"
version         = "0.8.4"
summary         = "Package manager for AROS: find, install, start, update and remove programs"
arch            = "x86_64"
abi             = "v11"
category        = "utility/system"
url             = "https://github.com/tomaszstaniak/arospkg/releases/download/v0.8.4/arospkg-0.8.4.x86_64-aros-v11.zip"
size            = 954563
sha256          = "ca5624f34f7fbd9999b705a9558296a9022855adbefb24b18b684d4f8b7be530"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "arospkg-0.8.4.x86_64-aros-v11"
installs_on     = ["aros-one"]
does_not_run_on = ["mainline-x86_64"]

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "muimaster.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[[requires_system]]
type = "library"
id   = "diskfont.library"

# PkgManager starts from its icon (RFC 0002); the archive carries the same
# table as application.json.
[launch]
executable = "PkgManager"
mode       = "workbench"

[source]
repository = "https://github.com/tomaszstaniak/arospkg"
revision   = "v0.8.4"
