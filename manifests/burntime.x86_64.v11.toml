# Burntime Remastered 1.3 for AROS, port release 1, AROS One and other x86_64 ABIv11 systems. A port of
# Jakob Harder's Burntime Remastered 1.3, rewritten in Rust; published by its
# author as a GitHub release asset (tag v1.3-aros1). No game data: the user
# makes burntime.pack from their own copy of the game (ReadMe in the drawer).
# The archive is the release's APKG; its Burntime/ drawer is installed.

status          = "approved"
id              = "burntime"
version         = "1.3"
revision        = 1
summary         = "Burntime Remastered 1.3, Max Design's survival strategy game (needs your own game data)"
category        = "game/strategy"
license         = "MIT; libraries: Zlib, BSD-3-Clause, LGPL-2.1-or-later"
url             = "https://github.com/tomaszstaniak/aros-burntime/releases/download/v1.3-aros1/Burntime-1.3-aros1-aros-x86_64-abiv11-pc.apkg.zip"
size            = 3493415
sha256          = "19f38044a940ee78b878419b2214975550f91cdde37c03a439d62c72b07f16be"
kind            = "app"
arch            = "x86_64"
abi             = "v11"

depends         = []
depends_checked = true
subdir          = "Burntime"
icon            = "Burntime.info"
installs_on     = []
runs_on         = []
does_not_run_on = ["mainline-x86_64"]

post_install_notes = [
  "Burntime needs burntime.pack made from your own copy of the game: see ReadMe in the drawer.",
  "Put it in a data drawer of its own, e.g. Work:Burntime-Data, then:",
  "MakeDir ENV:Burntime ENVARC:Burntime",
  "SetEnv SAVE Burntime/Data Work:Burntime-Data",
  "Start it from a Shell after Stack 2000000.",
]

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "m.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-burntime"
revision   = "v1.3-aros1"
