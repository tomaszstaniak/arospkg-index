# Limpet 0.4.0. Our own program, published by its author as a GitHub
# release asset (tag v0.4.0): icons dragged from Workbench put their paths
# on the Shell's command line.
#
# Same archive layout as 0.3.0 (checked on the release asset 2026-10-13).
# Limpet/ with the program, README.txt, fonts, themes and licences, plus
# Limpet.info beside it; only Limpet/Limpet and Limpet/README.txt differ.
# The terminal was tested on AROS One 1.3 x86_64 under QEMU with this
# program (limpet doc/verification-0.4.0.md).
# apkg upgrade from 0.3.0.
# 0.3.0 entry: approved 2026-10-11; 0.2.1: 2026-10-11; 0.2.0: 2026-10-08;
# 0.1.0: 2026-10-04.

status          = "approved"
id              = "limpet"
version         = "0.4.0"
revision        = 1
summary         = "Terminal for the AROS Shell: Unicode, colour, scrollback, reflow"
arch            = "x86_64"
abi             = "v11"
category        = "utility/shell"
url             = "https://github.com/tomaszstaniak/limpet/releases/download/v0.4.0/Limpet-0.4.0-abiv11.zip"
size            = 3653872
sha256          = "49e606fd8609588524c6e69db5537707584965fa4dd08da9bb545609c435c64f"
kind            = "app"

depends         = []
depends_checked = true
subdir          = "Limpet"
icon            = "Limpet.info"   # the drawer icon, beside Limpet/ at the archive root
installs_on     = ["aros-one"]
runs_on         = ["aros-one"]        # 0.4.0 started after apkg upgrade 2026-10-13
does_not_run_on = ["mainline-x86_64"] # ABIv11 binary; mainline is ABIv1

# Libraries the binary opens that AROS One supplies. The system fonts
# FONTS:TrueType/VeraMono.ttf and OpenSans-Regular.ttf are also required.
[[requires_system]]
type = "library"
id   = "freetype2.library"

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[source]
repository = "https://github.com/tomaszstaniak/limpet"
revision   = "v0.4.0"
built_with = "abiv11-x86_64, GCC 10.5.0"
