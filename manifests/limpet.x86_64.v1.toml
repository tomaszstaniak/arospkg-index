# Limpet 0.8.0: Preferences and per-window startup command, text/image
# capability queries, and inline image retention. Experimental handler is
# distributed separately. Release assets downloaded and SHA-256 checked.
# Runtime scope: limpet/doc/verification-0.8.0.md.
status          = "approved"
id              = "limpet"
version         = "0.8.0"
revision        = 1
summary         = "Terminal for the AROS Shell: Unicode, colour, scrollback, reflow"
arch            = "x86_64"
abi             = "v1"
category        = "utility/shell"
url             = "https://github.com/tomaszstaniak/limpet/releases/download/v0.8.0/Limpet-0.8.0-aros-x86_64-abiv1-pc.zip"
size            = 5257588
sha256          = "3a4187957f8eb3118bc337f8e044f3c09d095d08dd264f9e54984a2173b97359"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "Limpet"
icon            = "Limpet.info"   # the drawer icon, beside Limpet/ at the archive root
installs_on     = []
runs_on         = ["mainline-x86_64"]   # 0.8.0 started from the unpacked archive 2026-10-27
does_not_run_on = ["aros-one"]          # ABIv1 binary; AROS One is ABIv11

# Libraries the binary opens that mainline supplies. The system fonts
# FONTS:TrueType/OpenSans-Regular.ttf and VeraMono.ttf are also used.
[[requires_system]]
type = "library"
id   = "freetype2.library"

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[source]
repository = "https://github.com/tomaszstaniak/limpet"
revision   = "v0.8.0"
built_with = "mainline-x86_64, GCC 10.5.0"
