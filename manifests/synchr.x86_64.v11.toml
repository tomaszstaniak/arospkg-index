# Synchr 0.2 for ABIv11 distributions, x86_64 PC.
# Our own program, published by its author as an asset of the GitHub release
# v0.2 (one source commit for all three archives). First public release; the
# archive is revision 1 of the 0.2 package (the ReadMe gained the support
# links, the programs are those of 0.2).
# Synchr keeps drawers in step with Syncthing folders: a Zune window
# (Synchr) that starts and controls the engine (SynchrEngine).
# User data: the drawer Data inside the program drawer (identity, devices
# and folders, state, log). The window's Start with the system writes
# SYS:WBStartup/Synchr.info; apkg does not install or remove it, hence the
# note.
# requires_system: the C runtime libraries and the libraries opened at start
# (the binaries' automatic library lists, read with nm). muimaster.library,
# icon.library, iffparse.library, rexxsyslib.library (control port) and
# bsdsocket.library are opened by the programs themselves and not listed.

status          = "approved"
id              = "synchr"
version         = "0.2"
revision        = 1
summary         = "Keeps drawers in step with Syncthing folders on your other computers"
category        = "network/misc"
license         = "MIT; bundled parts keep their own licences, see NOTICE.txt"
url             = "https://github.com/tomaszstaniak/aros-synchr/releases/download/v0.2/Synchr-0.2-r1-aros-x86_64-abiv11-pc.zip"
size            = 2250835
sha256          = "748158eae0b80d0867234b6e98fa1adf140ec81b92c61618f521e13975e96f65"
kind            = "app"
arch            = "x86_64"
abi             = "v11"

depends         = []
depends_checked = true
subdir          = "Synchr"
icon            = "Synchr.info"   # the drawer icon, beside Synchr/ at the archive root
installs_on     = ["aros-one"]
runs_on         = ["aros-one"]
does_not_run_on = []

post_install_notes = [
  "Start Synchr from its icon. The ReadMe in the drawer walks through connecting the first device.",
  "Needs a running TCP/IP stack. Use test folders first: deleting a file on one side deletes it on the other.",
  "Before removing the package, untick Start with the system in the window, or delete SYS:WBStartup/Synchr.info.",
  "Removing the package leaves the drawer Data with this computer's identity (key.pem, cert.pem) in place.",
  "In QEMU use the rtl8139 network card: with e1000 the system can stop during transfers.",
]

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "intuition.library"

[[requires_system]]
type = "library"
id   = "utility.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-synchr"
revision   = "v0.2"
built_with = "AROS ABIv11 2026.09 SDK, GCC 10.5.0"

[launch]
executable = "Synchr"
mode       = "workbench"
