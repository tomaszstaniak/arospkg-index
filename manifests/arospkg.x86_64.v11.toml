# arospkg 0.7.6. An upgrade or rollback keeps the drawers the installed
# files did not fill (empty ones a program made for itself); apkg says when
# the drawer being upgraded is in use; archive members whose path would not
# fit are refused. installs_on is filled after an apkg test of these bytes
# from the published catalogue (runtime-tests/).

status          = "approved"
id              = "arospkg"
version         = "0.7.6"
summary         = "Package manager for AROS: find, install, start, update and remove programs"
arch            = "x86_64"
abi             = "v11"
category        = "utility/system"
url             = "https://github.com/tomaszstaniak/arospkg/releases/download/v0.7.6/arospkg-0.7.6.x86_64-aros-v11.zip"
size            = 1010143
sha256          = "a922c8855d73ef5cde1e5c17fdb685b72b06d236d4040e86e7bff4b313ee8936"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "arospkg-0.7.6.x86_64-aros-v11"
installs_on     = []
does_not_run_on = ["mainline-x86_64"]

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "muimaster.library"

# PkgManager starts from its icon (RFC 0002); the archive carries the same
# table as application.json.
[launch]
executable = "PkgManager"
mode       = "workbench"

[source]
repository = "https://github.com/tomaszstaniak/arospkg"
revision   = "v0.7.6"
