# arospkg 0.7.8. apkg install refuses a package the catalogue has only for
# another system and says which one it is for (it used to print "Installing",
# install nothing and end without an error). 0.7.7: an upgrade or rollback
# keeps the package drawer, so a Shell path or an assign to it keeps working.
# installs_on is filled after an apkg test of these bytes on the Pi
# (runtime-tests/).

status          = "approved"
id              = "arospkg"
version         = "0.7.8"
summary         = "Package manager for AROS: find, install, start, update and remove programs"
arch            = "aarch64"
abi             = "v1"
category        = "utility/system"
url             = "https://github.com/tomaszstaniak/arospkg/releases/download/v0.7.8/arospkg-0.7.8.aarch64-aros-raspi.zip"
size            = 1092049
sha256          = "edcc207337fc13cf58bd563e3eb5b75543b57e564321af1c7df3c9757a5d7fd7"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "arospkg-0.7.8.aarch64-aros-raspi"
installs_on     = []
does_not_run_on = []

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[[requires_system]]
type = "library"
id   = "muimaster.library"

# PkgManager starts from its icon; the archive carries the same table as
# application.json.
[launch]
executable = "PkgManager"
mode       = "workbench"

[source]
repository = "https://github.com/tomaszstaniak/arospkg"
revision   = "v0.7.8"
