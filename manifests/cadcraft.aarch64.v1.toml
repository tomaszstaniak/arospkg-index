id              = "cadcraft"
version         = "0.20.1"
summary         = "2D CAD drafting for DWG and DXF drawings with PDF and SVG export"
category        = "graphics/cad"
license         = "MIT OR Apache-2.0"
kind            = "app"
arch            = "aarch64"
abi             = "v1"
subdir          = "CADCraft"
icon            = "CADCraft.info"
