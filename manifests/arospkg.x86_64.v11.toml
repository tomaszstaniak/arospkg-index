# arospkg 0.7.8. apkg install refuses a package the catalogue has only for
# another system and says which one it is for (it used to print "Installing",
# install nothing and end without an error). 0.7.7: an upgrade or rollback
# keeps the package drawer, so a Shell path or an assign to it keeps working.
# installs_on: the published 0.7.7 self-updated to these bytes from GitHub
# on AROS One (QEMU, 2026-11-13), which then updated, installed, verified and
# removed fastfetch from the public catalogue (runtime-tests/).

status          = "approved"
id              = "arospkg"
version         = "0.7.8"
summary         = "Package manager for AROS: find, install, start, update and remove programs"
arch            = "x86_64"
abi             = "v11"
category        = "utility/system"
url             = "https://github.com/tomaszstaniak/arospkg/releases/download/v0.7.8/arospkg-0.7.8.x86_64-aros-v11.zip"
size            = 1011826
sha256          = "9ce14621524307edaca232614a482c8a3dc34205bcefec905bd111c999a87553"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "arospkg-0.7.8.x86_64-aros-v11"
installs_on     = ["aros-one"]
does_not_run_on = ["mainline-x86_64"]

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "muimaster.library"

# PkgManager starts from its icon (RFC 0002); the archive carries the same
# table as application.json.
[launch]
executable = "PkgManager"
mode       = "workbench"

[source]
repository = "https://github.com/tomaszstaniak/arospkg"
revision   = "v0.7.8"
