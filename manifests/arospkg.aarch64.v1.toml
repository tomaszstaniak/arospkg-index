# arospkg 0.7.5. PkgManager shows web addresses inside its text.
# Checked in QEMU: AROS 2026.09, AROS One 1.3, mainline x86_64 and Pi
# (links, self-update from 0.7.4); i386 apkg install and remove.

status          = "approved"
id              = "arospkg"
version         = "0.7.5"
summary         = "Package manager for AROS: find, install, start, update and remove programs"
arch            = "aarch64"
abi             = "v1"
category        = "utility/system"
url             = "https://github.com/tomaszstaniak/arospkg/releases/download/v0.7.5/arospkg-0.7.5.aarch64-aros-raspi.zip"
size            = 1087464
sha256          = "3dff377b31a94df5e761fd9b7bc6927bc57ae4af198a9d012afd609df97e811c"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "arospkg-0.7.5.aarch64-aros-raspi"
installs_on     = []
does_not_run_on = []

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[[requires_system]]
type = "library"
id   = "muimaster.library"

# PkgManager starts from its icon; the archive carries the same table as
# application.json.
[launch]
executable = "PkgManager"
mode       = "workbench"

[source]
repository = "https://github.com/tomaszstaniak/arospkg"
revision   = "v0.7.5"
