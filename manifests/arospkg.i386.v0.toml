# arospkg 0.7.8. apkg install refuses a package the catalogue has only for
# another system and says which one it is for (it used to print "Installing",
# install nothing and end without an error). 0.7.7: an upgrade or rollback
# keeps the package drawer, so a Shell path or an assign to it keeps working.
# installs_on is filled after an apkg test of these bytes from the
# published catalogue (runtime-tests/).

