# Limpet 0.12.2: the window is smart refresh with one layer, lighter to move; nothing else changed since 0.12.1.
# The terminal, its settings and the experimental handler (distributed separately) are unchanged.
# Release assets downloaded and SHA-256 checked. Runtime scope: limpet/doc/verification-0.12.2.md.
status          = "approved"
id              = "limpet"
version         = "0.12.2"
revision        = 1
summary         = "Terminal for the AROS Shell: Unicode, colour, scrollback, reflow"
arch            = "x86_64"
abi             = "v1"
category        = "utility/shell"
url             = "https://github.com/tomaszstaniak/limpet/releases/download/v0.12.2/Limpet-0.12.2-aros-x86_64-abiv1-pc.zip"
size            = 7320490
sha256          = "73c4d24082a6b141a8eefab578588ad5653d8ac820d4b5e856a1ac300aaa8b95"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "Limpet"
icon            = "Limpet.info"   # the drawer icon, beside Limpet/ at the archive root
installs_on     = ["mainline-x86_64"]   # apkg 0.7.8 install, verify and remove 2026-11-15 (runtime-tests/)
runs_on         = ["mainline-x86_64"]   # 0.12.2 run from the unpacked archive 2026-11-18
does_not_run_on = ["aros-one"]          # ABIv1 binary; AROS One is ABIv11

# Libraries the binary opens that mainline supplies. The system fonts
# FONTS:TrueType/OpenSans-Regular.ttf and VeraMono.ttf are also used.
[[requires_system]]
type = "library"
id   = "freetype2.library"

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[source]
repository = "https://github.com/tomaszstaniak/limpet"
revision   = "v0.12.2"
built_with = "mainline-x86_64, GCC 10.5.0"
