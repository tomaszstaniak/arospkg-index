# Limpet 0.15.0: LimpetLearn writes a TAB completion definition from a program's --help or an AmigaDOS
# command's template; definitions can hold the options of single subcommands.
# Release assets downloaded and SHA-256 checked. Runtime scope: limpet/doc/verification-0.15.0.md.
status          = "approved"
id              = "limpet"
version         = "0.15.0"
revision        = 1
summary         = "Terminal for the AROS Shell: Unicode, colour, scrollback, reflow"
arch            = "aarch64"
abi             = "v1"
category        = "utility/shell"
url             = "https://github.com/tomaszstaniak/limpet/releases/download/v0.15.0/Limpet-0.15.0-aros-aarch64-abiv1-raspi.zip"
size            = 7508924
sha256          = "92fc25a5025813e5c26c58a8eff688f111300239ebb134dc7c45a853e6ab1fe5"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "Limpet"
icon            = "Limpet.info"   # the drawer icon, beside Limpet/ at the archive root
installs_on     = ["mainline-aarch64"]   # apkg install and verify of 0.13.1 on nightly 2026-11-24, 2026-11-25 (runtime-tests/)
runs_on         = ["mainline-aarch64"]   # 0.15.0 run on nightly 2026-11-24, 2026-11-28 (runtime-tests/)
does_not_run_on = []

post_install_notes = [
  "Needs an AROS nightly of 2026-11-24 or later; for earlier nightlies use Limpet 0.13.0 from the project page.",
  "Raspberry Pi build, tested only under QEMU (raspi3b), not on a real Raspberry Pi.",
]

# Libraries the binaries open that the system supplies. The system fonts
# FONTS:TrueType/OpenSans-Regular.ttf and VeraMono.ttf are also used.
[[requires_system]]
type = "library"
id   = "freetype2.library"

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

# Revision 2 adds only this table: the same archive, now with Run in apkg
# and PkgManager.
[launch]
executable = "Limpet"
mode       = "workbench"

[source]
repository = "https://github.com/tomaszstaniak/limpet"
revision   = "v0.15.0"
built_with = "AROS raspi-aarch64 SDK of 2026-08-22 (mainline ABIv1), Clang 20.1"
