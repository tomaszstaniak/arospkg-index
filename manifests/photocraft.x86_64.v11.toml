# PhotoCraft for AROS 0.7.0-preview2-r2. Our own port of storytold/photocraft, published by its author as a
# GitHub release asset (prerelease, tag v0.7.0-preview2-r2). Experimental and not optimised.
# Rebuild 2: the same program as the earlier test build, without build-machine paths.
# Archive layout (checked 2026-10-20): PhotoCraft/ with PhotoCraft, its icon, the CLI, README, SOURCE.txt and Licenses/, plus PhotoCraft.info beside it.
# First entry for this package.

status          = "approved"
id              = "photocraft"
version         = "0.7.0-preview2-r2"
revision        = 1
summary         = "Image editor with layers, masks, painting and PSD/PNG files (experimental, not optimised)"
category        = "graphics/edit"
license         = "MIT OR Apache-2.0"
url             = "https://github.com/tomaszstaniak/aros-photocraft/releases/download/v0.7.0-preview2-r2/PhotoCraft-0.7.0-preview2-r2.x86_64-aros-v11.zip"
size            = 48556283
sha256          = "d4a560aea87a2cdee1a2ef2b55521ad17d99d8abdbc5cabd605e451bb6b47290"
kind            = "app"
arch            = "x86_64"
abi             = "v11"

depends         = []
depends_checked = true
subdir          = "PhotoCraft"
icon            = "PhotoCraft.info"   # the drawer icon, beside PhotoCraft/ at the archive root
installs_on     = ["aros-one"]
does_not_run_on = ["mainline-x86_64"] # ABIv11 binary; mainline is ABIv1

post_install_notes = [
  "Experimental and not optimised: the interface is drawn by the CPU and reacts slowly. Use a test installation.",
  "Use file names without accented letters. Large documents can be slow.",
  "x86_64 ABIv11 only; letters typed with a non-Latin-1 keymap come out wrong.",
]

# System libraries the programs open; AROS One supplies them. bsdsocket.library is optional.
[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[[requires_system]]
type = "library"
id   = "iffparse.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-photocraft"
revision   = "v0.7.0-preview2-r2"
built_with = "abiv11-x86_64, GCC 10.5.0, Rust nightly 1.100 (rust-aros)"

[launch]
executable = "PhotoCraft"
mode       = "workbench"
