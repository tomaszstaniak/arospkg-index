# arospkg 0.7.2. Our own program, published by its author as a GitHub
# release asset: apkg and PkgManager, for native AROS on the Raspberry Pi.
#
# Run on native AROS for the Raspberry Pi (nightly 20261029, non-SMP) under QEMU
# raspi3b with networking on 2026-10-30: the published 0.7.1 updated itself from
# GitHub to 0.7.2 (apkg and PkgManager). PkgManager's links (new in 0.7.2) were
# built for the Pi, not run there.
# The entry's target is aarch64/v1, which a hosted (Macaros) aarch64 client also matches; this build is
# for the Pi's own SDK.
# 0.4.0 entry: approved 2026-10-04.

status          = "approved"
id              = "arospkg"
version         = "0.7.2"
summary         = "Package manager for AROS: find, install, start, update and remove programs"
arch            = "aarch64"
abi             = "v1"
category        = "utility/system"
url             = "https://github.com/tomaszstaniak/arospkg/releases/download/v0.7.2/arospkg-0.7.2.aarch64-aros-raspi.zip"
size            = 1075018
sha256          = "5f4ab10349c40cc6bc70b85783d8b00168addda53c5aae117f7c24f50ebfb3c4"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "arospkg-0.7.2.aarch64-aros-raspi"
installs_on     = []
does_not_run_on = []

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[[requires_system]]
type = "library"
id   = "muimaster.library"

# PkgManager starts from its icon; the archive carries the same table as
# application.json.
[launch]
executable = "PkgManager"
mode       = "workbench"

[source]
repository = "https://github.com/tomaszstaniak/arospkg"
revision   = "v0.7.2"
