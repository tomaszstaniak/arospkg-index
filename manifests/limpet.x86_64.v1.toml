# Limpet 0.11.0: adds an SSH client (ssh in the drawer; libssh with the aros-crypto kit).
# The terminal, its settings and the experimental handler (distributed separately) are unchanged.
# Release assets downloaded and SHA-256 checked. Runtime scope: limpet/doc/verification-0.11.0.md.
status          = "approved"
id              = "limpet"
version         = "0.11.0"
revision        = 1
summary         = "Terminal for the AROS Shell: Unicode, colour, scrollback, reflow"
arch            = "x86_64"
abi             = "v1"
category        = "utility/shell"
url             = "https://github.com/tomaszstaniak/limpet/releases/download/v0.11.0/Limpet-0.11.0-aros-x86_64-abiv1-pc.zip"
size            = 5826576
sha256          = "358f2678c4c6e4bec0141c2303be813711150b05bd6f9589f2ca17fa880a531a"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "Limpet"
icon            = "Limpet.info"   # the drawer icon, beside Limpet/ at the archive root
installs_on     = ["mainline-x86_64"]   # apkg install, upgrade, verify and remove of 0.10.1 (runtime-tests/); 0.11.0 record follows
runs_on         = ["mainline-x86_64"]   # 0.11.0 run from the unpacked archive 2026-11-14
does_not_run_on = ["aros-one"]          # ABIv1 binary; AROS One is ABIv11

# Libraries the binary opens that mainline supplies. The system fonts
# FONTS:TrueType/OpenSans-Regular.ttf and VeraMono.ttf are also used.
[[requires_system]]
type = "library"
id   = "freetype2.library"

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[source]
repository = "https://github.com/tomaszstaniak/limpet"
revision   = "v0.11.0"
built_with = "mainline-x86_64, GCC 10.5.0"
