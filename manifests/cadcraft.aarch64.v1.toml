post_install_notes = [
  "Native Raspberry Pi build (nightly 2026-11-10). Tested in an emulator only.",
  "The CPU draws the whole window on every change, so the interface reacts with a delay on slow machines.",
  "GUI_RENDERER ToolType: AUTO (default), CPU or GPU. AUTO uses OpenGL only when it is not Mesa software OpenGL.",
  "Settings, autosave files and CADCraft.log are kept in CADCraftData in the program drawer; keep it when upgrading.",
  "Updates come through the AROS package manager.",
]
sha256          = "c33b7869a5fe74afbb2c023138417445f7e70a5b84b3e63f883cd7a2f8cf614c"
size            = 37109973
status          = "approved"
url             = "https://github.com/tomaszstaniak/aros-cadcraft/releases/download/v0.20.1/CADCraft-0.20.1-aros-aarch64-abiv1-raspi.zip"

[[requires_system]]
type = "library"
