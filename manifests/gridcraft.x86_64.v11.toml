# GridCraft for AROS 0.8.0-test3. Our own port of storytold/gridcraft, published by its author as a
# GitHub release asset (prerelease, tag v0.8.0-test3). Experimental and not optimised.
# Test 3: keeps the startup drawer's lock on the main task (Workbench exit fix), whole-program LTO, stripped programs.
# Archive layout (checked 2026-10-23): GridCraft/ with GridCraft, its icon, the CLI, README, SOURCE.txt and Licenses/, plus GridCraft.info beside it.
# Every file is under 64 MiB, so apkg 0.5.0 installs it too.
# Test 2 (0.8.0-test2) was withdrawn: it exited at startup. Previous working entry: 0.8.0-test1-r2 (2026-10-20).

status          = "approved"
id              = "gridcraft"
version         = "0.8.0-test3"
revision        = 1
summary         = "Spreadsheet for XLSX with formulas, charts and CSV/PDF export (experimental, not optimised)"
category        = "office/spreadsheet"
license         = "MIT OR Apache-2.0"
url             = "https://github.com/tomaszstaniak/aros-gridcraft/releases/download/v0.8.0-test3/GridCraft-0.8.0-test3.x86_64-aros-v11.zip"
size            = 14719746
sha256          = "f02fdb0a84d85a65e51f0c464cec91074daf11f5f9870072e61301476766230a"
kind            = "app"
arch            = "x86_64"
abi             = "v11"

depends         = []
depends_checked = true
subdir          = "GridCraft"
icon            = "GridCraft.info"   # the drawer icon, beside GridCraft/ at the archive root
installs_on     = ["aros-one"]
does_not_run_on = ["mainline-x86_64"] # ABIv11 binary; mainline is ABIv1

post_install_notes = [
  "Experimental and not optimised: the interface is drawn by the CPU and reacts slowly. Use a test installation.",
  "Save before closing the window: the close gadget does not ask about unsaved changes.",
  "Settings are kept in GridCraftData inside the program's drawer.",
  "x86_64 ABIv11 only; letters typed with a non-Latin-1 keymap come out wrong.",
]

# System libraries the programs open; AROS One supplies them. bsdsocket.library is optional.
[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[[requires_system]]
type = "library"
id   = "iffparse.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-gridcraft"
revision   = "v0.8.0-test3"
built_with = "abiv11-x86_64, GCC 10.5.0, Rust nightly 1.100 (rust-aros)"

[launch]
executable = "GridCraft"
mode       = "workbench"
