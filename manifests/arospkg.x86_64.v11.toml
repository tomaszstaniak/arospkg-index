# arospkg 0.7.3. PkgManager fixes link backgrounds after hover.
# v11 and mainline GUI checked in QEMU; Pi and i386 compiled only.

status          = "approved"
id              = "arospkg"
version         = "0.7.3"
summary         = "Package manager for AROS: find, install, start, update and remove programs"
arch            = "x86_64"
abi             = "v11"
category        = "utility/system"
url             = "https://github.com/tomaszstaniak/arospkg/releases/download/v0.7.3/arospkg-0.7.3.x86_64-aros-v11.zip"
size            = 996428
sha256          = "88b075466bea40fff9d820dc4c978ef92d12e7a23c1858ffad8814d703030fc4"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "arospkg-0.7.3.x86_64-aros-v11"
installs_on     = ["aros-one"]
does_not_run_on = ["mainline-x86_64"]

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "muimaster.library"

# PkgManager starts from its icon (RFC 0002); the archive carries the same
# table as application.json.
[launch]
executable = "PkgManager"
mode       = "workbench"

[source]
repository = "https://github.com/tomaszstaniak/arospkg"
revision   = "v0.7.3"
