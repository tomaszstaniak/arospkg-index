# Limpet 0.13.0: a choice of prompts, TAB completion of a known command's keywords and drawer arguments,
# the SSH programs on a stack of their own, Ctrl-C ends a wait for the server.
# Release assets downloaded and SHA-256 checked. Runtime scope: limpet/doc/verification-0.13.0.md.
status          = "approved"
id              = "limpet"
version         = "0.13.0"
revision        = 1
summary         = "Terminal for the AROS Shell: Unicode, colour, scrollback, reflow"
arch            = "x86_64"
abi             = "v11"
category        = "utility/shell"
url             = "https://github.com/tomaszstaniak/limpet/releases/download/v0.13.0/Limpet-0.13.0-aros-x86_64-abiv11-pc.zip"
size            = 7460982
sha256          = "52228e7e5bdd8f66b5f1ee4bb8400ab205b8c5b0b8fd57f59048107365454499"
kind            = "app"

depends         = []
depends_checked = true
subdir          = "Limpet"
icon            = "Limpet.info"   # the drawer icon, beside Limpet/ at the archive root
installs_on     = ["aros-one"]
runs_on         = ["aros-one"]   # 0.13.0 run from the unpacked archive 2026-11-21
does_not_run_on = ["mainline-x86_64"] # ABIv11 binary; mainline is ABIv1

# Libraries the binary opens that AROS One supplies. The system font
# FONTS:TrueType/VeraMono.ttf is used when the bundled font is removed or
# another font is set; OpenSans-Regular.ttf is also required.
[[requires_system]]
type = "library"
id   = "freetype2.library"

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[source]
repository = "https://github.com/tomaszstaniak/limpet"
revision   = "v0.13.0"
built_with = "abiv11-x86_64, GCC 10.5.0"
