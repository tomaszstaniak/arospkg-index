# Limpet 0.12.2: the window is smart refresh with one layer, lighter to move; nothing else changed since 0.12.1.
# The terminal, its settings and the experimental handler (distributed separately) are unchanged.
# Release assets downloaded and SHA-256 checked. Runtime scope: limpet/doc/verification-0.12.2.md.
status          = "approved"
id              = "limpet"
version         = "0.12.2"
revision        = 1
summary         = "Terminal for the AROS Shell: Unicode, colour, scrollback, reflow"
arch            = "aarch64"
abi             = "v1"
category        = "utility/shell"
url             = "https://github.com/tomaszstaniak/limpet/releases/download/v0.12.2/Limpet-0.12.2-aros-aarch64-abiv1-raspi.zip"
size            = 7372721
sha256          = "92ee8d1ddc5d716413e1c76d39b1670acfe96743ac25ed7ae3f0414677cc098d"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "Limpet"
icon            = "Limpet.info"   # the drawer icon, beside Limpet/ at the archive root
installs_on     = ["mainline-aarch64"]
runs_on         = ["mainline-aarch64"]   # 0.12.1 run from the unpacked archive 2026-11-15; 0.12.2 built, not run
does_not_run_on = []

post_install_notes = [
  "Raspberry Pi build, tested only under QEMU (raspi3b), not on a real Raspberry Pi.",
]

# Libraries the binaries open that the system supplies. The system fonts
# FONTS:TrueType/OpenSans-Regular.ttf and VeraMono.ttf are also used.
[[requires_system]]
type = "library"
id   = "freetype2.library"

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[source]
repository = "https://github.com/tomaszstaniak/limpet"
revision   = "v0.12.2"
built_with = "AROS raspi-aarch64 SDK of 2026-08-22 (mainline ABIv1), Clang 20.1"
