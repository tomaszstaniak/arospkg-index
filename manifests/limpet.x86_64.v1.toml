# Limpet 0.10.1: maintenance release of 0.10.0 (colour themes, Preferences in three pages).
# Mainline builds that show transparent windows without a frame keep a solid background.
# Experimental handler is distributed separately. Release assets downloaded and SHA-256 checked.
# Runtime scope: limpet/doc/verification-0.10.1.md.
status          = "approved"
id              = "limpet"
version         = "0.10.1"
revision        = 1
summary         = "Terminal for the AROS Shell: Unicode, colour, scrollback, reflow"
arch            = "x86_64"
abi             = "v1"
category        = "utility/shell"
url             = "https://github.com/tomaszstaniak/limpet/releases/download/v0.10.1/Limpet-0.10.1-aros-x86_64-abiv1-pc.zip"
size            = 5300674
sha256          = "9daa170e7934ed520c9a4281ef5af416b40a8c134dc1a607f76f8c9934c060da"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "Limpet"
icon            = "Limpet.info"   # the drawer icon, beside Limpet/ at the archive root
installs_on     = []
runs_on         = ["mainline-x86_64"]   # 0.10.1 run from the unpacked archive 2026-11-14
does_not_run_on = ["aros-one"]          # ABIv1 binary; AROS One is ABIv11

# Libraries the binary opens that mainline supplies. The system fonts
# FONTS:TrueType/OpenSans-Regular.ttf and VeraMono.ttf are also used.
[[requires_system]]
type = "library"
id   = "freetype2.library"

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[source]
repository = "https://github.com/tomaszstaniak/limpet"
revision   = "v0.10.1"
built_with = "mainline-x86_64, GCC 10.5.0"
