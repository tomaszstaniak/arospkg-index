# 0.7.1: Dockbar 0.7.0, its widgets and svgicon.library rebuilt with the SDK of
# nightly 2026-11-24 (release v0.7.1, mainline x86_64 only). The text below
# describes 0.7.0.
# Dockbar 0.7.0 for x86_64 mainline AROS (ABIv1), PC, with SVG icons.
# Our own program, published by its author as an asset of the GitHub
# release v0.7.0 (one source commit for all three archives).
# It carries libs/svgicon.library, which Dockbar opens as
# PROGDIR:libs/svgicon.library, and the Weather widget (Widgets/org.aros.weather).
# replaces: dockbar-info-only (0.5.1, the same program without svgicon.library)
# is not continued. apkg 0.6 and later install this package, then remove
# dockbar-info-only; the user's files stay in its drawer, and Dockbar copies
# docks.config, dock.pins and WidgetState from there on its first start
# (only into a drawer that has none of them yet). replaces implies the
# conflict the two ids had in 0.5.1.
# User data lives in the program drawer: PROGDIR:docks.config and
# PROGDIR:WidgetState/. Neither is in the archive, so apkg keeps both on
# upgrade and removal as files it did not install.
# 0.7.0 adds the Currency widget (Widgets/org.aros.currency, exchange rates of
# the European Central Bank) and cards a widget describes in its views.json.
# 0.6.2 fixes "Could not launch provider" after an upgrade: Dockbar makes its
# request drawer (WidgetState/.s-*) again when it is missing, as it was after
# an apkg upgrade (before arospkg 0.7.6) while Dockbar ran.
# 0.6.1 adds Start with Wanderer: a project icon SYS:WBStartup/Dockbar.info
# whose default tool is the program in this drawer (written only on the
# user's request). apkg does not install or remove it.
# 0.6.0 adds the message port Dockbar.Widgets: other programs (AROS Capture)
# install their own widget into Dockbar's Widgets drawer. Those widgets are
# user files to apkg (not in the archive) and stay on upgrade and removal.
# requires_system: the C runtime libraries the binaries open at start, and
# muimaster and cybergraphics, which Dockbar opens. openurl.library (About
# links) and bsdsocket.library (widget data) are optional and not listed.
# installs_on, runs_on: apkg 0.7.8 installed 0.6.2 and upgraded it to these
# bytes from a local index on a mainline nightly (2026-11-13) under QEMU
# (2026-11-18); 0.7.0 started from the upgraded drawer, and from the unpacked
# archive both widgets were added and showed their data (runtime-tests/).
# The Weather helper calls __stdc_set_taskexit (stdc.library 0.52) only when
# the running stdc.library has it, so since 0.5.2 it does not need 0.52.

status          = "approved"
id              = "dockbar"
version         = "0.7.1"
revision        = 1
summary         = "Dock with application groups, drawer panels, action widgets, Weather and Currency"
category        = "utility/workbench"
license         = "MIT; bundled parts keep their own licences, see NOTICES"
url             = "https://github.com/tomaszstaniak/aros-dockbar/releases/download/v0.7.1/Dockbar-0.7.1-aros-x86_64-abiv1-pc.zip"
size            = 13398733
sha256          = "8550681d7a8c1f3d4229e3b515a84ec56711d7c394c92dac2af4ebab2e7a1087"
kind            = "app"
arch            = "x86_64"
abi             = "v1"

depends         = []
depends_checked = true
replaces        = ["dockbar-info-only"]
subdir          = "Dockbar"
icon            = "Dockbar.info"   # the drawer icon, beside Dockbar/ at the archive root
installs_on     = ["mainline-x86_64"]
runs_on         = ["mainline-x86_64"]
does_not_run_on = []

post_install_notes = [
  "Needs an AROS nightly of 2026-11-24 or later; for earlier nightlies use Dockbar 0.7.0 from the project page.",
  "Replaces dockbar-info-only, which is not continued. On its first start Dockbar copies docks.config, dock.pins and WidgetState from that drawer.",
  "Your docks (docks.config) and widget data (WidgetState) are kept in this drawer. apkg keeps them on upgrade and removal.",
  "To start Dockbar with the system, tick Start with Wanderer in its Preferences. Do not copy the program into SYS:WBStartup.",
  "A copy of Dockbar in SYS:WBStartup keeps starting the old version: quit it, start Dockbar from this drawer and choose Replace the copy.",
  "Weather and Currency need a running TCP/IP stack.",
  "With VMware SVGA graphics the docks can be invisible. Start Dockbar with --no-compose then.",
]

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[[requires_system]]
type = "library"
id   = "muimaster.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-dockbar"
revision   = "v0.7.1"
built_with = "mainline AROS x86_64 SDK (AROS 531307d8, 2026-11-01), GCC 10.5.0"

[launch]
executable = "Dockbar"
mode       = "workbench"
