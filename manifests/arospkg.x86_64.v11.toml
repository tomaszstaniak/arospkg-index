# arospkg 0.7.5. PkgManager shows web addresses inside its text.
# Checked in QEMU: AROS 2026.09, AROS One 1.3, mainline x86_64 and Pi
# (links, self-update from 0.7.4); i386 apkg install and remove.

status          = "approved"
id              = "arospkg"
version         = "0.7.5"
summary         = "Package manager for AROS: find, install, start, update and remove programs"
arch            = "x86_64"
abi             = "v11"
category        = "utility/system"
url             = "https://github.com/tomaszstaniak/arospkg/releases/download/v0.7.5/arospkg-0.7.5.x86_64-aros-v11.zip"
size            = 1008614
sha256          = "9dd622906cd56570a5b15e8683da90083cf85999fc30473544153dd1dbeed9ac"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "arospkg-0.7.5.x86_64-aros-v11"
installs_on     = ["aros-one"]
does_not_run_on = ["mainline-x86_64"]

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "muimaster.library"

# PkgManager starts from its icon (RFC 0002); the archive carries the same
# table as application.json.
[launch]
executable = "PkgManager"
mode       = "workbench"

[source]
repository = "https://github.com/tomaszstaniak/arospkg"
revision   = "v0.7.5"
