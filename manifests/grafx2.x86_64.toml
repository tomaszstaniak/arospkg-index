# APPROVED 2026-09-26. Our own port, published by its author as a GitHub release.
# The archive carries its own .arospkg/manifest.toml; this entry agrees with it
# (id, version, revision, subdir, icon, requirements).
#
# Needs an 8 MiB stack. The program icon inside the drawer carries it, so a
# start from Wanderer works; from a Shell, `stack 8388608` first (GrafX2/ReadMe.txt says
# so). Started from a 40960-byte Shell, GrafX2 crashes: on 2026-09-26 GrafX2
# hung the whole test machine that way.
#
# Checked on AROS One 1.3 x86_64 (ABIv11) under QEMU with apkg 0.2 (a513aea7),
# from a Shell at 40960 bytes: install downloaded from url over HTTPS through
# GitHub's redirect, verified the hash, installed the drawer and its icon;
# started with an 8 MiB stack, running after 20 s; remove deleted what it
# installed. Evidence: docs/reports/2026-09-26-catalogue/.

status          = "approved"
id              = "grafx2"
version         = "2.9"
revision        = 4                   # this port's fourth release of GrafX2 2.9
summary         = "256-colour indexed paint program for AROS"
arch            = "x86_64"
abi             = "v11"
category        = "graphics/edit"
url             = "https://github.com/tomaszstaniak/aros-grafx2/releases/download/v2.9-r4/GrafX2-2.9-r4.x86_64-aros-v11.lha"
size            = 4207684
sha256          = "b037cb10dbdd7e2d527764a3b6f1d48bcf9876dd954ba7595fed3c55820d2d61"
kind            = "app"

depends         = []
depends_checked = true
subdir          = "GrafX2"
icon            = "GrafX2.info"       # the drawer icon, beside GrafX2/ at the archive root
installs_on     = ["aros-one"]        # apkg 0.2 (a513aea7), AROS One 1.3, 2026-09-26
runs_on         = ["aros-one"]        # started and running after 20 s, then removed
does_not_run_on = ["mainline-x86_64"] # ABIv11 binary; mainline is ABIv1

# The binary names crt.library, m.library and stdlib.library, the ABIv11
# runtime. Everything else it names is in every AROS; gl.library is linked
# and present on both checked systems; muimaster and ahi.device appear as
# strings and are not opened by the editor.
[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-grafx2"
revision   = "v2.9-r4"
archive    = "GrafX2-2.9-r4-full-source.zip"
sha256     = "11839cd3ce58d79d5c270205c941db76676edf22827b6b8c344ae554a1d6b49b"
built_with = "abiv11-x86_64, GCC 10.5.0"
