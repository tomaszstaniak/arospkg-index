# Listed 2026-10-14: the AROS Archives file at this URL was re-uploaded with
# the same version 050500: recompiled against a newer SDL2, sounds moved into
# data.zip on 2026-10-04. Size and SHA-256 were measured on the new download;
# its review is the catalogue's automatic one. The install-and-start test of
# 2026-09-20 was made with the previous archive (sha256 671d89c9b45c...) and
# is kept in runtime-tests/; it does not cover these bytes, so the installs_on
# and runs_on claims it supported were removed.

status          = "approved"
id              = "xrick"
version         = "050500"
revision        = 1
summary         = "a clone of Rick Dangerous"
arch            = "x86_64"
abi             = "v11"
category        = "game/platform"
url             = "https://archives.arosworld.org/share/game/platform/xrick.x86_64-aros-v11.zip"
size            = 2050668
upload_date     = "20261004-12.28"

sha256          = "b257180ca022dc64b9cef491569dfa9088b219fecceb37c62492a597097c0a0c"

depends         = []
depends_checked = true     # no package in the index is needed to install this

kind            = "app"
subdir          = "xRick"
icon            = "xRick.info"

does_not_run_on = ["mainline-x86_64"]   # ABIv11 binary; the ABI gate refuses it there

# What the MACHINE must already provide: libraries AROS One ships and mainline
# does not, read out of the binaries and checked against both systems' Libs/.
[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "m.library"         # named by the author's .arospkg/manifest.toml in the new archive

[[requires_system]]
type = "library"
id   = "stdlib.library"
