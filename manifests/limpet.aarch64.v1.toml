# Limpet 0.13.0: a choice of prompts, TAB completion of a known command's keywords and drawer arguments,
# the SSH programs on a stack of their own, Ctrl-C ends a wait for the server.
# Release assets downloaded and SHA-256 checked. Runtime scope: limpet/doc/verification-0.13.0.md.
status          = "approved"
id              = "limpet"
version         = "0.13.0"
revision        = 1
summary         = "Terminal for the AROS Shell: Unicode, colour, scrollback, reflow"
arch            = "aarch64"
abi             = "v1"
category        = "utility/shell"
url             = "https://github.com/tomaszstaniak/limpet/releases/download/v0.13.0/Limpet-0.13.0-aros-aarch64-abiv1-raspi.zip"
size            = 7383408
sha256          = "c202e3c2a5d164d846b0fe8369c5c237869cd7a19389bee121ac6e375b577aa9"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "Limpet"
icon            = "Limpet.info"   # the drawer icon, beside Limpet/ at the archive root
installs_on     = ["mainline-aarch64"]
runs_on         = ["mainline-aarch64"]   # a 0.13.0 build of the same day run from its unpacked drawer 2026-11-21; the released archive not run again
does_not_run_on = []

post_install_notes = [
  "Raspberry Pi build, tested only under QEMU (raspi3b), not on a real Raspberry Pi.",
]

# Libraries the binaries open that the system supplies. The system fonts
# FONTS:TrueType/OpenSans-Regular.ttf and VeraMono.ttf are also used.
[[requires_system]]
type = "library"
id   = "freetype2.library"

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[source]
repository = "https://github.com/tomaszstaniak/limpet"
revision   = "v0.13.0"
built_with = "AROS raspi-aarch64 SDK of 2026-08-22 (mainline ABIv1), Clang 20.1"
