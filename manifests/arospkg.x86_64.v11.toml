# arospkg 0.5.0. Our own program, published by its author as a GitHub
# release asset: apkg and PkgManager.
#
# 0.5.0 adds apkg run and PkgManager's Run and Verify. The release archive
# was tested on AROS One 1.3 x86_64 (ABIv11) under QEMU on 2026-10-12
# . Installed through this entry and
# started.
# 0.4.2 entry: approved 2026-10-11; 0.4.1: 2026-10-08; 0.4.0: 2026-10-04.

status          = "approved"
id              = "arospkg"
version         = "0.5.0"
summary         = "Package manager for AROS: find, install, start, update and remove programs"
arch            = "x86_64"
abi             = "v11"
category        = "utility/system"
url             = "https://github.com/tomaszstaniak/arospkg/releases/download/v0.5.0/arospkg-0.5.0.x86_64-aros-v11.zip"
size            = 854414
sha256          = "4fc6b9d91b505054cc3025562e2586fb7d5714b95ec01496da85a9c7c8a5aa3c"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "arospkg-0.5.0.x86_64-aros-v11"
installs_on     = ["aros-one"]
does_not_run_on = ["mainline-x86_64"]

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "muimaster.library"

# PkgManager starts from its icon (RFC 0002); the archive carries the same
# table as application.json.
[launch]
executable = "PkgManager"
mode       = "workbench"

[source]
repository = "https://github.com/tomaszstaniak/arospkg"
revision   = "v0.5.0"
