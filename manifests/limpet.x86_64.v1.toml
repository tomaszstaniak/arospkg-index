# Limpet 0.13.0: a choice of prompts, TAB completion of a known command's keywords and drawer arguments,
# the SSH programs on a stack of their own, Ctrl-C ends a wait for the server.
# Release assets downloaded and SHA-256 checked. Runtime scope: limpet/doc/verification-0.13.0.md.
status          = "approved"
id              = "limpet"
version         = "0.13.0"
revision        = 2
summary         = "Terminal for the AROS Shell: Unicode, colour, scrollback, reflow"
arch            = "x86_64"
abi             = "v1"
category        = "utility/shell"
url             = "https://github.com/tomaszstaniak/limpet/releases/download/v0.13.0/Limpet-0.13.0-aros-x86_64-abiv1-pc.zip"
size            = 7331542
sha256          = "bf507fd70703b0842ff628e201bc23c4dd7ec7c6ca564eaab9e7f3ed3b462da5"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "Limpet"
icon            = "Limpet.info"   # the drawer icon, beside Limpet/ at the archive root
installs_on     = ["mainline-x86_64"]   # apkg 0.7.8 install, verify and remove 2026-11-21 (runtime-tests/)
runs_on         = ["mainline-x86_64"]   # 0.13.0 run from the unpacked archive 2026-11-21
does_not_run_on = ["aros-one"]          # ABIv1 binary; AROS One is ABIv11

# Libraries the binary opens that mainline supplies. The system fonts
# FONTS:TrueType/OpenSans-Regular.ttf and VeraMono.ttf are also used.
[[requires_system]]
type = "library"
id   = "freetype2.library"

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

# Revision 2 adds only this table: the same archive, now with Run in apkg
# and PkgManager.
[launch]
executable = "Limpet"
mode       = "workbench"

[source]
repository = "https://github.com/tomaszstaniak/limpet"
revision   = "v0.13.0"
built_with = "mainline-x86_64, GCC 10.5.0"
