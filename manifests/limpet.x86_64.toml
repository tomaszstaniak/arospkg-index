# Limpet 0.12.1: adds scp, ssh-keygen and ssh-copy-id beside ssh (libssh with the aros-crypto kit).
# The terminal, its settings and the experimental handler (distributed separately) are unchanged.
# Release assets downloaded and SHA-256 checked. Runtime scope: limpet/doc/verification-0.12.1.md.
status          = "approved"
id              = "limpet"
version         = "0.12.1"
revision        = 1
summary         = "Terminal for the AROS Shell: Unicode, colour, scrollback, reflow"
arch            = "x86_64"
abi             = "v11"
category        = "utility/shell"
url             = "https://github.com/tomaszstaniak/limpet/releases/download/v0.12.1/Limpet-0.12.1-aros-x86_64-abiv11-pc.zip"
size            = 7450511
sha256          = "603953e0b00a1fb46152beecb346851f97cbb6cc71fef56af31397727a11f948"
kind            = "app"

depends         = []
depends_checked = true
subdir          = "Limpet"
icon            = "Limpet.info"   # the drawer icon, beside Limpet/ at the archive root
installs_on     = ["aros-one"]
runs_on         = ["aros-one"]   # 0.12.1 run from the unpacked archive 2026-11-15
does_not_run_on = ["mainline-x86_64"] # ABIv11 binary; mainline is ABIv1

# Libraries the binary opens that AROS One supplies. The system font
# FONTS:TrueType/VeraMono.ttf is used when the bundled font is removed or
# another font is set; OpenSans-Regular.ttf is also required.
[[requires_system]]
type = "library"
id   = "freetype2.library"

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[source]
repository = "https://github.com/tomaszstaniak/limpet"
revision   = "v0.12.1"
built_with = "abiv11-x86_64, GCC 10.5.0"
