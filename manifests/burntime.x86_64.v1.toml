# Burntime Remastered 1.3 for AROS, port release 3 (port release 1 rebuilt with
# the SDK of nightly 2026-11-24), mainline AROS x86_64 (ABIv1). A port of
# Jakob Harder's Burntime Remastered 1.3, rewritten in Rust; published by its
# author as a GitHub release asset (tag v1.3-aros3). No game data: the user
# makes burntime.pack from their own copy of the game (ReadMe in the drawer).
# The archive is the release's APKG; its Burntime/ drawer is installed.

status          = "approved"
id              = "burntime"
version         = "1.3"
revision        = 3
summary         = "Burntime Remastered 1.3, Max Design's survival strategy game (needs your own game data)"
category        = "game/strategy"
license         = "MIT; libraries: Zlib, BSD-3-Clause, LGPL-2.1-or-later"
url             = "https://github.com/tomaszstaniak/aros-burntime/releases/download/v1.3-aros3/Burntime-1.3-aros3-aros-x86_64-abiv1-pc.apkg.zip"
size            = 3724692
sha256          = "23809f35049780cb2b4807f42bcf52490a31dcbca570e6e69088dc512a929695"
kind            = "app"
arch            = "x86_64"
abi             = "v1"

depends         = []
depends_checked = true
subdir          = "Burntime"
icon            = "Burntime.info"
installs_on     = []
runs_on         = []
does_not_run_on = ["aros-one"]

post_install_notes = [
  "Needs an AROS nightly of 2026-11-24 or later; for earlier nightlies use Burntime 1.3 port release 1 from the project page.",
  "Burntime needs burntime.pack made from your own copy of the game: see ReadMe in the drawer.",
  "Put it in a data drawer of its own, e.g. Work:Burntime-Data, then:",
  "MakeDir ENV:Burntime ENVARC:Burntime",
  "SetEnv SAVE Burntime/Data Work:Burntime-Data",
  "Start it from a Shell after Stack 2000000.",
]

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[[requires_system]]
type = "library"
id   = "posixc.library"

# Revision 2 adds only this table: the same archive, now with Run in apkg
# and PkgManager.
[launch]
executable = "Burntime"
mode       = "workbench"

[source]
repository = "https://github.com/tomaszstaniak/aros-burntime"
revision   = "v1.3-aros3"
