# arospkg 0.8.0. A new PkgManager window: views and categories in a list on
# the left, a button in every row (Install, Run or Upgrade), a page for each
# package, a menu. Pictures of packages (icons, screenshots) from the media
# drawer of the package root. The demonstration of 0.5.0 to 0.7.8 is removed.
# installs_on: these bytes updated the catalogue and installed, verified and
# removed arca on the Pi (QEMU raspi3b, 2026-11-23; runtime-tests/).

status          = "approved"
id              = "arospkg"
version         = "0.8.0"
summary         = "Package manager for AROS: find, install, start, update and remove programs"
arch            = "aarch64"
abi             = "v1"
category        = "utility/system"
url             = "https://github.com/tomaszstaniak/arospkg/releases/download/v0.8.0/arospkg-0.8.0.aarch64-aros-raspi.zip"
size            = 1041693
sha256          = "99993b2e1d82d6ae6dc0870df4473691341afff1d227354197f23e70a0c26b66"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "arospkg-0.8.0.aarch64-aros-raspi"
installs_on     = ["mainline-aarch64"]
does_not_run_on = []

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[[requires_system]]
type = "library"
id   = "muimaster.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[[requires_system]]
type = "library"
id   = "diskfont.library"

# PkgManager starts from its icon; the archive carries the same table as
# application.json.
[launch]
executable = "PkgManager"
mode       = "workbench"

[source]
repository = "https://github.com/tomaszstaniak/arospkg"
revision   = "v0.8.0"
