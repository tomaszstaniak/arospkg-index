# arospkg 0.7.1. Our own program, published by its author as a GitHub
# release asset: apkg and PkgManager, for native AROS on the Raspberry Pi.
#
# Started on native AROS for the Raspberry Pi (raspi-aarch64 20260822) under QEMU
# raspi3b on 2026-10-30 (0.7.0): apkg version and self-update check, PkgManager start;
# 0.7.1 changes only the GUI's update hand-off and was built, not run there. That
# machine had no network: update and downloads untested there.
# The entry's target is aarch64/v1, which a hosted (Macaros) aarch64 client also matches; this build is
# for the Pi's own SDK.
# 0.4.0 entry: approved 2026-10-04.

status          = "approved"
id              = "arospkg"
version         = "0.7.1"
summary         = "Package manager for AROS: find, install, start, update and remove programs"
arch            = "aarch64"
abi             = "v1"
category        = "utility/system"
url             = "https://github.com/tomaszstaniak/arospkg/releases/download/v0.7.1/arospkg-0.7.1.aarch64-aros-raspi.zip"
size            = 1062242
sha256          = "004500a505e7295817a2313231828f0a7807d766d96cae213eb9656f8253d1f1"
kind            = "app"
license         = "MIT"

depends         = []
depends_checked = true
subdir          = "arospkg-0.7.1.aarch64-aros-raspi"
installs_on     = []
does_not_run_on = []

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[[requires_system]]
type = "library"
id   = "muimaster.library"

# PkgManager starts from its icon; the archive carries the same table as
# application.json.
[launch]
executable = "PkgManager"
mode       = "workbench"

[source]
repository = "https://github.com/tomaszstaniak/arospkg"
revision   = "v0.7.1"
